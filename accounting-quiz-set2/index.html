<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>중급회계 실전 모의고사 2세트</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--brand:#3157d5;--brand2:#eef2ff;--good:#067647;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fef3f2;--warn:#b54708;--warnbg:#fffaeb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;line-height:1.55}.wrap{max-width:960px;margin:auto;padding:16px 13px 80px}.card,.hero{background:var(--card);border:1px solid var(--line);border-radius:18px}.hero{padding:23px}.hero h1{margin:0 0 7px;font-size:25px}.sub{color:var(--muted);margin:0}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.meta div{padding:10px;border:1px solid var(--line);border-radius:12px;text-align:center;background:#fafbfc}.meta b{display:block}.sticky{position:sticky;top:0;z-index:10;padding:8px 0;background:rgba(245,247,251,.94);backdrop-filter:blur(10px)}.status{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}.timer{font-weight:900;font-variant-numeric:tabular-nums}.progress{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;flex:1}.progress div{height:100%;background:var(--brand);width:0}.answered{font-size:13px;color:var(--muted)}.q{padding:18px;margin:12px 0}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.qnum{font-weight:900;color:var(--brand)}.tag{font-size:12px;background:#f2f4f7;color:#475467;border-radius:999px;padding:4px 8px}.stem{font-weight:750;font-size:16.5px;white-space:pre-line;margin:13px 0}.option{display:flex;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:var(--brand);background:var(--brand2)}.option input{margin-top:4px;transform:scale(1.12)}.optn{font-weight:900;min-width:22px}.confuse{margin-top:10px}.confuse label{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#7a4b00;background:#fff7e8;border:1px solid #fedf89;padding:7px 10px;border-radius:10px;cursor:pointer}.submitbox,.scorecard,.weak,.review{padding:20px;margin-top:14px}.submitbox{text-align:center}.btn{border:0;border-radius:12px;padding:13px 17px;font-weight:850;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:var(--card);border:1px solid var(--line);color:var(--text)}.result{display:none}.scoreline{display:flex;align-items:flex-end;gap:10px}.score{font-size:54px;font-weight:950;line-height:1}.badge{font-weight:850;padding:6px 10px;border-radius:999px}.good{background:var(--goodbg);color:var(--good)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metricTop{display:flex;justify-content:space-between;font-weight:800}.bar{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--brand)}.weakitem{padding:11px 12px;border-left:4px solid #f79009;background:#fffcf5;border-radius:8px;margin:8px 0}.rItem{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.rItem.ok{background:#fbfffc;border-color:#abefc6}.rItem.no{background:#fffdfd;border-color:#fecdca}.rTitle{font-weight:900}.small{font-size:14px;color:var(--muted)}.explain{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:14px}.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:640px){.meta{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr}.hero h1{font-size:21px}.q{padding:15px}.answered{display:none}}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b23;--text:#f0f3f6;--muted:#9da7b3;--line:#2b3440;--brand:#7897ff;--brand2:#1c294d;--goodbg:#0d2a20;--badbg:#321a1c;--warnbg:#33230e}.sticky{background:rgba(13,17,23,.94)}.meta div{background:#11161d}.tag{background:#222a34;color:#c5ced8}.confuse label{background:#2b2111;border-color:#6d4c1c}.weakitem{background:#2b2111}}</style></head><body><div class="wrap"><section class="hero"><h1>중급회계 실전 모의고사 2세트 — 중상 난이도</h1><p class="sub">교수님 수업자료 예제 구조와 1~25 출제포인트를 반영한 새 세트. 1세트와 숫자·상황·선지를 바꿨고, 헷갈린 문제도 따로 표시할 수 있습니다.</p><div class="meta"><div><b>25문항</b><span>5지선다</span></div><div><b>50분</b><span>권장시간</span></div><div><b>100점</b><span>문항당 4점</span></div><div><b>중상</b><span>예제형 함정 강화</span></div></div></section><div class="sticky"><div class="status"><div class="timer" id="timer">50:00</div><div class="progress"><div id="pbar"></div></div><div class="answered" id="answered">0 / 25 응답</div></div></div><form id="quiz"></form><section class="card submitbox"><button class="btn primary" id="submitBtn" type="button">전체 제출하고 채점하기</button><p class="small">정답뿐 아니라 체크한 ‘헷갈림’ 문항도 복습목록에 반영됩니다.</p></section><section class="result" id="result"><div class="card scorecard"><h2>채점 결과</h2><div class="scoreline"><div class="score" id="score">0</div><div style="font-weight:900;font-size:20px">/ 100</div><div class="badge" id="grade"></div></div><p class="sub" id="summary"></p><div class="metrics" id="metrics"></div><div class="foot"><button class="btn secondary" id="focusBtn" type="button">오답·헷갈림만 보기</button><button class="btn secondary" id="resetBtn" type="button">처음부터 다시 풀기</button></div></div><div class="card weak"><h2>우선 복습 개념</h2><div id="weak"></div></div><div class="card review"><h2>문항별 해설</h2><div id="reviews"></div></div></section></div><script>const L=['①','②','③','④','⑤'];const qs=[{id:1,area:'회계환경·기준',type:'개념',concept:'IFRS 특징',stem:'다음 중 국제회계기준(IFRS)의 특징으로 가장 보기 어려운 것은?',o:['개별 상황에 대한 전문가의 판단을 중시하는 원칙중심 접근법을 취한다.','연결재무제표 중심의 재무보고를 중시한다.','정보이용자의 판단을 돕기 위해 공시를 강화하는 경향이 있다.','업종 간 회계처리 차이를 줄이기 위해 산업별 세부기준과 구체적 실무지침을 확대한다.','공정가치 측정의 적용범위를 확대하는 경향이 있다.'],a:3,e:'교수자료의 IFRS 특징은 원칙중심·연결재무제표 중심·공시강화·공정가치 확대이다. 산업별 세부기준이나 구체적 실무지침은 지양한다.'},{id:2,area:'회계환경·기준',type:'개념',concept:'회계정보의 기능',stem:'다음 중 회계정보의 기능과 사례의 연결이 적절하지 않은 것은?',o:['정보제공기능 — 투자자가 기업의 예상수익과 위험을 평가한다.','정보제공기능 — 경영자가 위임받은 자원의 운용 결과를 주주에게 보고한다.','정보제공기능 — 자원을 효율적으로 사용하는 기업을 파악한다.','수탁기능 — 경영자가 외부주주에게 재무상태와 경영성과를 보고한다.','정보제공기능 — 희소한 경제적 자원이 자본시장에서 효율적으로 배분되도록 돕는다.'],a:1,e:'위임받은 자원의 운용 결과를 주주에게 보고하는 것은 수탁기능이다. 투자·대출 등 경제적 의사결정을 지원하는 기능과 구분해야 한다.'},{id:3,area:'회계환경·기준',type:'개념',concept:'재무보고와 재무제표',stem:'다음 중 재무제표 자체의 구성요소가 아닌 항목으로만 묶인 것은?',o:['사업보고서, 경영자예측, 경영자서한','현금흐름표, 사업보고서, 경영자서한','자본변동표, 경영자예측, 사회·환경적 영향 설명','주석, 사업보고서, 경영자예측','포괄손익계산서, 경영자서한, 사회·환경적 영향 설명'],a:0,e:'사업보고서·경영자예측·경영자서한은 재무보고의 기타수단이지만 재무제표 구성요소는 아니다. 재무상태표·포괄손익계산서·자본변동표·현금흐름표·주석은 재무제표다.'},{id:4,area:'재무제표',type:'개념',concept:'재무제표 작성·표시',stem:'다음 <보기> 중 재무제표 작성과 표시에 관한 설명으로 옳은 것만을 묶은 것은?\n\nㄱ. K-IFRS를 준수하면 공정하게 표시한 것으로 본다.\nㄴ. 현금흐름표를 포함한 모든 재무제표에 발생기준회계를 적용한다.\nㄷ. 중요하지 않은 항목은 통합하여 표시할 수 있다.\nㄹ. 동일 성격의 자산과 부채는 자유롭게 상계할 수 있다.\nㅁ. 전체 재무제표는 적어도 1년에 한 번 작성하고 비교정보를 제시한다.',o:['ㄱ, ㄴ, ㄷ','ㄱ, ㄹ, ㅁ','ㄱ, ㄷ, ㅁ','ㄴ, ㄷ, ㄹ','ㄱ, ㄴ, ㄷ, ㅁ'],a:2,e:'현금흐름표는 발생기준 적용 대상에서 제외되고, 자산·부채 및 수익·비용은 원칙적으로 상계하지 않는다. 따라서 ㄱ·ㄷ·ㅁ만 옳다.'},{id:5,area:'회계환경·기준',type:'개념',concept:'GAAP',stem:'다음 중 일반적으로 인정된 회계원칙(GAAP)에 관한 설명으로 가장 부적절한 것은?',o:['일반목적 재무제표의 작성지침으로 기능한다.','회계기준서와 해석서는 GAAP의 중요한 원천이 될 수 있다.','전통적으로 사용되어 온 회계처리방법도 실무수용의 근거가 될 수 있다.','이론적으로 충분히 뒷받침되는 회계처리방법도 GAAP의 범위에 포함될 수 있다.','GAAP는 재무보고 개념체계와 동일하므로 기준서·해석서·실무관행과는 구별되는 개념이다.'],a:4,e:'교수자료의 GAAP는 개념체계 하나만을 뜻하지 않는다. 공식 기준서·해석서와 실무에서 수용된 방법 등까지 포함하는 넓은 개념이다.'},{id:6,area:'측정·공정가치',type:'개념',concept:'측정기준',stem:'다음 중 기업특유 관점의 현행가치 측정기준으로만 묶인 것은?',o:['공정가치, 현행원가','사용가치, 이행가치','역사적원가, 공정가치','현행원가, 사용가치','공정가치, 이행가치'],a:1,e:'사용가치는 자산, 이행가치는 부채에 대한 기업특유 측정치다. 공정가치는 시장참여자 관점이다.'},{id:7,area:'측정·공정가치',type:'개념',concept:'질적특성',stem:'회계정보의 질적특성에 관한 설명 중 옳지 않은 것은?',o:['목적적합성과 표현충실성은 근본적 질적특성이다.','비교가능성과 검증가능성은 보강적 질적특성이다.','적시성과 이해가능성은 보강적 질적특성이다.','측정불확실성은 목적적합성에만 영향을 미치며 표현충실성과는 관계가 없다.','동일 항목에 동일한 측정기준을 계속 사용하면 비교가능성 향상에 도움이 될 수 있다.'],a:3,e:'측정불확실성이 지나치게 높으면 표현충실성이 저해될 수 있다. 따라서 표현충실성과 무관하다고 볼 수 없다.'},{id:8,area:'측정·공정가치',type:'개념',concept:'공정가치 유용성',stem:'다음 중 공정가치의 유용성과 한계에 관한 설명으로 옳지 않은 것은?',o:['시장참여자의 현재 기대를 반영해 투자·신용의사결정에 목적적합한 정보를 제공할 수 있다.','모든 금융상품을 공정가치로 평가하면 보유이익 상품만 골라 처분하는 이익거래 기회를 줄일 수 있다.','가치평가기법을 사용해야 하는 경우 공시가격을 직접 사용하는 경우보다 검증가능성이 일반적으로 높아진다.','경영자의 매수·보유 의사결정 성과를 비교적 신속히 반영할 수 있다.','관측 가능한 시장가격이 없는 경우 측정의 신뢰성이나 검증가능성이 낮아질 수 있다.'],a:2,e:'가치평가기법은 추정과 가정이 개입되므로 공시가격을 직접 사용하는 경우보다 신뢰성·검증가능성이 낮아질 수 있다.'},{id:9,area:'재무제표',type:'개념',concept:'재무제표 유용성과 한계',stem:'다음 중 재무제표의 유용성과 한계의 연결이 적절하지 않은 것은?',o:['재무상태표 — 임금협상의 기초자료 제공이 대표적 유용성이다.','재무상태표 — 유동성과 재무탄력성에 관한 정보를 제공한다.','재무상태표 — 역사적원가 사용으로 현재 공정가치를 충분히 반영하지 못할 수 있다.','포괄손익계산서 — 미래현금흐름 예측에 도움을 줄 수 있다.','포괄손익계산서 — 회계처리방법에 따라 회계이익이 달라질 수 있다.'],a:0,e:'임금협상의 기초자료 제공은 교수자료에서 포괄손익계산서의 유용성으로 제시된다. 재무상태표는 자원·재무구조·유동성·재무탄력성 정보가 핵심이다.'},{id:10,area:'재무제표',type:'개념',concept:'재무제표 식별정보',stem:'다음 중 재무제표에 표시해야 하는 식별정보가 아닌 항목으로만 묶인 것은?',o:['보고기업 명칭, 대표이사 성명','표시통화, 감사인 성명','보고기간, 업종코드','개별기업인지 연결실체인지 여부, 대표이사 성명','대표이사 성명, 감사인 성명, 업종코드'],a:4,e:'필수 식별정보는 보고기업 명칭, 개별/연결 여부, 보고기간 종료일 또는 보고기간, 표시통화, 금액표시 단위다. 대표이사 성명·감사인 성명·업종코드는 해당 목록이 아니다.'},{id:11,area:'재고자산',type:'개념',concept:'계속기록법·실지재고조사법',stem:'계속기록법과 실지재고조사법에 관한 설명 중 옳지 않은 것은?',o:['계속기록법은 매입과 판매 시 재고자산계정에 직접 기록한다.','실지재고조사법에서는 기중 매입을 매입계정에 기록할 수 있다.','실지재고조사법은 장부재고와 실사재고를 항상 비교할 수 있으므로 재고감모를 매출원가와 별도로 자동 식별한다.','계속기록법에서는 장부재고와 실사재고의 차이로 감모를 별도로 파악할 수 있다.','실지재고조사법의 매출원가는 기초재고+순매입-기말 실사재고로 계산할 수 있다.'],a:2,e:'실지재고조사법은 기중에 장부수량을 상시 유지하지 않기 때문에 감모가 매출원가에 포함될 수 있다. 계속기록법은 장부재고와 실사재고를 비교해 감모를 별도로 파악할 수 있다.'},{id:12,area:'재고자산',type:'계산',concept:'매출원가·감모',stem:'기초재고 120,000원, 당기매입 280,000원, 매입운임 15,000원, 매입환출 25,000원, 매입할인 10,000원이다. 계속기록법상 결산 직전 장부상 기말재고는 130,000원이고 기말 실사재고는 121,000원이다.\n\n계속기록법상 판매 시점까지 기록된 매출원가, 재고감모손실, 실지재고조사법상 매출원가의 조합으로 옳은 것은?',o:['250,000원 / 9,000원 / 250,000원','259,000원 / 0원 / 259,000원','259,000원 / 9,000원 / 259,000원','250,000원 / 9,000원 / 259,000원','250,000원 / 0원 / 259,000원'],a:3,e:'판매가능원가=120+280+15−25−10=380천원. 계속법 판매시점 COGS=380−130=250천원, 감모=130−121=9천원, 실지법 COGS=380−121=259천원.'},{id:13,area:'재고자산',type:'계산',concept:'재고자산 포함범위',stem:'기말 실사재고 1,450,000원에는 다른 회사가 당사에 판매를 위탁한 상품 80,000원과, 생산 및 고객검수가 완료되어 소유권이 고객에게 이전된 특별주문품 120,000원이 포함되어 있다.\n\n다음 항목은 실사재고에 포함되지 않았다.\n• 당사가 수탁자에게 보낸 위탁상품 원가 150,000원과 발송비 6,000원\n• FOB 선적지조건으로 매입하여 운송 중인 상품 원가 100,000원과 당사 부담 매입운임 5,000원\n• FOB 도착지조건으로 매입하여 운송 중인 상품 원가 90,000원\n• FOB 도착지조건으로 판매하여 고객에게 아직 도착하지 않은 상품 원가 75,000원\n• 시용판매로 보냈으나 고객이 매입의사를 표시하지 않은 상품 원가 55,000원\n\n재무제표에 표시할 기말재고자산은?',o:['1,551,000원','1,641,000원','1,731,000원','1,566,000원','1,706,000원'],a:1,e:'1,450−80−120+156+105+75+55=1,641천원이다. FOB 도착지조건 매입품 90천원은 도착 전까지 판매자 재고이므로 당사 재고에 포함하지 않는다. 반대로 당사가 FOB 도착지조건으로 판매한 75천원은 고객에게 도착 전까지 당사 재고다.'},{id:14,area:'재고자산',type:'계산',concept:'평균법 소매재고법',stem:'평균법 소매재고법을 적용한다.\n\n기초재고: 원가 24,000원 / 소매가 36,000원\n당기매입: 원가 100,000원 / 소매가 144,000원\n매입환출: 원가 8,000원 / 소매가 12,000원\n매입운임: 원가 10,000원\n순인상: 18,000원\n순인하: 6,000원\n순매출: 110,000원\n\n당기 매출원가는?',o:['77,000원','72,000원','81,000원','84,000원','70,000원'],a:0,e:'판매가능원가=24+100−8+10=126천원. 판매가능 소매가=36+144−12+18−6=180천원, 원가율 70%. 기말재고 소매가=70천원, 원가=49천원, 매출원가=126−49=77천원. 매입운임은 원가열에만 포함한다.'},{id:15,area:'재고자산',type:'개념',concept:'후입선출법',stem:'물가가 지속적으로 상승하는 상황에서 후입선출법(LIFO)에 관한 설명으로 옳지 않은 것은?',o:['일반적으로 FIFO보다 기말재고가 작게 나타날 수 있다.','일반적으로 FIFO보다 매출원가가 크게 나타날 수 있다.','일반적으로 FIFO보다 당기순이익이 작게 나타날 수 있다.','LIFO 청산이 발생하면 과거의 낮은 원가가 매출원가에 포함되어 매출원가가 증가하고 이익이 감소할 수 있다.','IFRS는 LIFO에 의한 재고자산 평가를 허용하지 않는다.'],a:3,e:'LIFO 청산 시 과거의 낮은 원가가 매출원가로 흘러들어가므로 매출원가는 비정상적으로 낮아지고 당기이익은 커질 수 있다.'},{id:16,area:'재고자산',type:'개념',concept:'재고자산 측정·저가법',stem:'다음 중 재고자산의 원가결정 및 저가법에 관한 설명으로 옳지 않은 것은?',o:['상호 교환될 수 없는 재고자산이나 특정 프로젝트별로 분리되는 재화에는 개별법을 적용할 수 있다.','성격과 용도가 유사한 재고라도 보관 장소가 다르면 서로 다른 단위원가 결정방법을 자유롭게 적용할 수 있다.','순실현가능가치는 추정판매가격에서 완성 및 판매에 필요한 원가를 차감하여 구한다.','저가법은 종목별 기준이 원칙이며 유사하거나 관련된 재고에는 조별기준을 적용할 수 있다.','순실현가능가치가 회복되면 과거 평가손실을 최초 장부금액 한도에서 환입할 수 있다.'],a:1,e:'교수자료는 성격과 용도 면에서 유사한 재고자산에는 동일한 단위원가 결정방법을 적용하도록 한다. 보관 장소가 다르다는 이유만으로 자유롭게 달리 적용하는 것은 아니다.'},{id:17,area:'지분법',type:'계산',concept:'지분법 기본',stem:'투자기업이 관계기업의 의결권 30%를 보유하여 지분법을 적용한다. 관계기업의 당기순이익은 200,000원, 현금배당은 80,000원이다. 다른 변동은 없다. 투자기업이 인식할 지분법이익, 배당으로 수취하는 현금, 투자주식 장부금액의 순증가액의 조합으로 옳은 것은?',o:['60,000원 / 24,000원 / 60,000원','24,000원 / 60,000원 / 36,000원','60,000원 / 24,000원 / 36,000원','36,000원 / 24,000원 / 60,000원','60,000원 / 80,000원 / 36,000원'],a:2,e:'지분법이익은 200,000×30%=60,000원으로 투자주식이 증가한다. 배당 80,000×30%=24,000원은 현금 증가·투자주식 감소이므로 장부금액 순증가액은 36,000원이다.'},{id:18,area:'수익인식',type:'계산',concept:'할부판매·현재가치',stem:'20X1년 1월 1일 원가 1,800,000원의 상품을 할부판매하였다. 계약일에 400,000원을 즉시 받고, 20X1년 12월 31일과 20X2년 12월 31일에 각각 1,210,000원을 받기로 하였다. 연 유효이자율은 10%이다.\n\n판매시점의 매출수익과 매출총이익의 조합으로 옳은 것은?',o:['매출수익 2,100,000원 / 매출총이익 300,000원','매출수익 2,820,000원 / 매출총이익 1,020,000원','매출수익 2,400,000원 / 매출총이익 600,000원','매출수익 2,500,000원 / 매출총이익 300,000원','매출수익 2,500,000원 / 매출총이익 700,000원'],a:4,e:'미래대금의 현재가치는 1,210,000/1.1 + 1,210,000/1.1² = 1,100,000+1,000,000=2,100,000원. 즉시 수령 400,000원을 더하면 매출수익 2,500,000원, 매출총이익은 700,000원이다.'},{id:19,area:'수익인식',type:'개념',concept:'고객과의 계약 식별',stem:'다음 중 K-IFRS 제1115호상 고객과의 계약으로 식별할 수 있는 경우는?',o:['구두로 계약을 승인하고 각자의 의무 수행을 확약했으며, 권리와 지급조건이 식별되고 상업적 실질이 있으며 대가의 회수가능성이 높다.','서면계약이 있고 권리와 지급조건이 식별되지만 거래에 상업적 실질이 없다.','계약당사자는 승인했으나 이전할 재화·용역에 관한 각 당사자의 권리를 식별할 수 없다.','상업적 실질과 지급조건은 확인되지만 대가의 회수가능성이 높다고 판단하기 어렵다.','권리와 지급조건은 식별되지만 계약당사자가 각자의 의무를 수행하기로 확약하지 않았다.'],a:0,e:'계약 식별 5요건은 승인·확약, 권리 식별, 지급조건 식별, 상업적 실질, 대가 회수가능성 높음이다. 계약 승인 형태는 서면에 한정되지 않는다.'},{id:20,area:'건설계약',type:'계산',concept:'진행률·당기계약이익',stem:'총계약금액 240,000,000원의 건설계약에 원가법을 적용한다.\n\n20X1년: 당기 발생 계약원가 36,000,000원, 연말 추정 총계약원가 120,000,000원\n20X2년: 당기 발생 계약원가 54,000,000원, 연말 수정 추정 총계약원가 150,000,000원\n\n20X2년의 당기 계약이익은?',o:['9,000,000원','12,000,000원','18,000,000원','24,000,000원','36,000,000원'],a:2,e:'X1 진행률 30% → 누적수익 72백만원. X2 누적원가 90백만원, 최신 총원가 150백만원 → 진행률 60%, 누적수익 144백만원. X2 당기수익 72백만원이므로 당기이익은 72−54=18백만원이다.'},{id:21,area:'수익인식',type:'개념',concept:'수행의무 식별',stem:'다음 중 수행의무의 식별에 관한 설명으로 옳지 않은 것은?',o:['컴퓨터 성능을 보증하기 위한 일반적인 품질보증은 컴퓨터 판매와 하나의 수행의무로 판단할 수 있다.','소비자가 선택하여 별도로 구매하는 장기 A/S는 제품판매와 별도 수행의무가 될 수 있다.','재화·용역이 고객에게 자체적으로 효익을 제공하고 계약 안에서도 다른 약속과 별도로 식별 가능하면 별도 수행의무가 될 수 있다.','재화·용역이 자체적으로 뚜렷이 구분되기만 하면 계약 내 다른 재화·용역과의 관계를 추가로 검토할 필요 없이 항상 별도 수행의무로 본다.','여러 재화·용역을 유의적으로 통합하여 하나의 결합산출물을 제공한다면 단일 수행의무로 판단할 수 있다.'],a:3,e:'별도 수행의무가 되려면 ① 재화·용역 자체가 뚜렷이 구분되고 ② 계약 내 다른 재화·용역과도 별도로 식별 가능해야 한다. 두 조건을 모두 본다.'},{id:22,area:'수익인식',type:'개념',concept:'수익인식 시점',stem:'다음 거래 중 수행의무를 한 시점에 충족하는 것으로 보는 것이 가장 적절한 것은?',o:['고객이 서비스 제공과 동시에 효익을 소비하는 매일의 청소용역','고객 맞춤형 특수장비로 대체용도는 없지만, 고객은 제작 중 자산을 통제하지 않고 기업은 지금까지 수행한 부분에 대해 집행가능한 대금청구권도 없다.','고객 소유 토지 위에 건물을 건설하며 고객이 건설 중인 자산을 통제한다.','대체용도가 없는 맞춤형 자산이며 지금까지 수행한 부분에 대한 집행가능한 지급청구권이 있다.','기간 동안 고객이 효익을 동시에 소비하는 케이블TV 서비스'],a:1,e:'기간에 걸친 인식의 세 번째 요건은 대체용도가 없음과 수행한 부분에 대한 집행가능한 지급청구권을 모두 요구한다. 문제의 특수장비는 그 요건을 충족하지 못하고 다른 기간인식 요건도 충족하지 않으므로 한 시점 인식이 적절하다.'},{id:23,area:'지분법',type:'계산',concept:'지분법 장부금액',stem:'㈜A는 20X1년 초 ㈜B의 의결권 있는 주식 40%를 900,000원에 취득하고 지분법을 적용한다.\n20X1년 ㈜B의 당기순이익은 300,000원, 현금배당은 100,000원이다.\n20X2년 ㈜B의 당기순이익은 150,000원, 현금배당은 120,000원이다.\n\n20X2년에 인식할 지분법이익과 20X2년 말 투자주식 장부금액의 조합으로 옳은 것은?',o:['지분법이익 48,000원 / 장부금액 992,000원','지분법이익 60,000원 / 장부금액 1,040,000원','지분법이익 12,000원 / 장부금액 992,000원','배당금수익 48,000원 / 장부금액 1,040,000원','지분법이익 60,000원 / 장부금액 992,000원'],a:4,e:'X1말 장부금액=900+120−40=980천원. X2 지분법이익=150×40%=60천원, 배당에 따른 투자주식 감소=120×40%=48천원. 기말 장부금액=980+60−48=992천원이다.'},{id:24,area:'수익인식',type:'계산',concept:'패키지 거래가격 배분',stem:'서로 별도 수행의무인 A, B, C의 개별판매가격은 각각 120,000원, 80,000원, 50,000원이다. 세 제품을 패키지로 220,000원에 판매한다. C는 단독판매 시 항상 50,000원에 판매되고, A와 B를 함께 판매할 때는 통상 170,000원에 판매하므로 패키지 할인은 A와 B에만 관련된 것으로 판단된다.\n\nB에 배분할 거래가격은?',o:['64,000원','66,000원','68,000원','70,400원','80,000원'],a:2,e:'C에는 50,000원을 그대로 배분한다. 나머지 170,000원을 A:B=120:80=3:2로 배분하므로 B는 170,000×2/5=68,000원이다.'},{id:25,area:'건설계약',type:'계산',concept:'진행률·당기순이익',stem:'총계약금액 300,000,000원의 건설계약에 원가법을 적용한다.\n\n20X1년: 당기 계약원가 60,000,000원, 추정 총계약원가 200,000,000원\n20X2년: 당기 계약원가 90,000,000원, 수정 추정 총계약원가 240,000,000원\n\n20X2년에는 이 건설계약 외에 이자수익 4,500,000원과 판매관리비 2,000,000원이 발생했다. 법인세는 무시한다.\n\n20X2년 당기순이익은?',o:['7,500,000원','10,000,000원','12,000,000원','90,000,000원','97,500,000원'],a:1,e:'X1 진행률 30% → 누적수익 90백만원. X2 누적원가 150백만원/최신 총원가 240백만원=62.5%, 누적수익 187.5백만원. X2 당기수익=97.5백만원, 계약이익=7.5백만원. 당기순이익=7.5+4.5−2=10백만원.'}];const el=id=>document.getElementById(id),form=el('quiz'),timer=el('timer'),pbar=el('pbar'),answered=el('answered'),result=el('result'),score=el('score'),grade=el('grade'),summary=el('summary'),metrics=el('metrics'),weak=el('weak'),reviews=el('reviews'),submitBtn=el('submitBtn'),focusBtn=el('focusBtn'),resetBtn=el('resetBtn');form.innerHTML=qs.map(q=>`<section class="card q" id="q${q.id}"><div class="qhead"><div class="qnum">${q.id}번</div><div><span class="tag">${q.area}</span> <span class="tag">${q.type}</span></div></div><div class="stem">${q.stem}</div>${q.o.map((x,i)=>`<label class="option"><input type="radio" name="q${q.id}" value="${i}"><span class="optn">${L[i]}</span><span>${x}</span></label>`).join('')}<div class="confuse"><label><input type="checkbox" class="flag" data-q="${q.id}"> 이 문제 헷갈림 표시</label></div></section>`).join('');const KEY='acct_mock_set2_v2';let end=Date.now()+50*60*1000,showFocusOnly=false;try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.end){end=s.end;Object.entries(s.answers||{}).forEach(([id,v])=>{const x=document.querySelector(`input[name=q${id}][value="${v}"]`);if(x)x.checked=true});(s.flags||[]).forEach(id=>{const x=document.querySelector(`.flag[data-q="${id}"]`);if(x)x.checked=true})}}catch(e){}function answers(){const a={};qs.forEach(q=>{const x=document.querySelector(`input[name=q${q.id}]:checked`);if(x)a[q.id]=+x.value});return a}function flags(){return [...document.querySelectorAll('.flag:checked')].map(x=>+x.dataset.q)}function update(){const n=Object.keys(answers()).length;answered.textContent=`${n} / 25 응답`;pbar.style.width=`${n/25*100}%`}function save(){localStorage.setItem(KEY,JSON.stringify({end,answers:answers(),flags:flags()}));update()}form.addEventListener('change',save);update();setInterval(()=>{const s=Math.max(0,Math.floor((end-Date.now())/1000));timer.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);const pct=(c,n)=>n?Math.round(c/n*100):0;function submit(){const a=answers(),fl=flags(),missing=25-Object.keys(a).length;if(missing&&!confirm(`미응답 ${missing}문항이 있습니다. 그래도 제출할까요?`))return;const ok=qs.map(q=>a[q.id]===q.a),correct=ok.filter(Boolean).length,sc=correct*4;score.textContent=sc;const t=sc>=90?['매우 안정','good']:sc>=76?['보완 필요','warn']:['집중 복습','bad'];grade.textContent=t[0];grade.className=`badge ${t[1]}`;summary.textContent=`정답 ${correct}개 · 오답/미응답 ${25-correct}개 · 헷갈림 표시 ${fl.length}개`;const groups=['회계환경·기준','측정·공정가치','재무제표','재고자산','지분법','수익인식','건설계약'];metrics.innerHTML=groups.map(name=>{const idx=qs.map((q,i)=>q.area===name?i:-1).filter(i=>i>=0),c=idx.filter(i=>ok[i]).length,p=pct(c,idx.length);return `<div class="metric"><div class="metricTop"><span>${name}</span><span>${p}% (${c}/${idx.length})</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join('')+['개념','계산'].map(name=>{const idx=qs.map((q,i)=>q.type===name?i:-1).filter(i=>i>=0),c=idx.filter(i=>ok[i]).length,p=pct(c,idx.length);return `<div class="metric"><div class="metricTop"><span>${name}문제</span><span>${p}% (${c}/${idx.length})</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join('');window.quizOK=ok;window.quizA=a;window.quizFlags=fl;renderWeak();renderReviews();result.style.display='block';result.scrollIntoView({behavior:'smooth'});localStorage.removeItem(KEY)}function renderWeak(){const ok=window.quizOK||[],fl=window.quizFlags||[],focus=qs.map((q,i)=>({q,i,wrong:!ok[i],flag:fl.includes(q.id)})).filter(x=>x.wrong||x.flag);weak.innerHTML=focus.length?focus.map(x=>`<div class="weakitem"><b>${x.q.id}번 · ${x.q.concept}</b> — ${x.wrong?'오답':''}${x.wrong&&x.flag?' + ':''}${x.flag?'헷갈림':''}<br>${x.q.e}</div>`).join(''):'<div class="weakitem" style="border-left-color:#12b76a;background:var(--goodbg)"><b>우선 복습 개념 없음</b><br>오답과 헷갈림 표시가 없습니다.</div>'}function renderReviews(){const a=window.quizA||{},ok=window.quizOK||[],fl=window.quizFlags||[];reviews.innerHTML=qs.map((q,i)=>{if(showFocusOnly&&ok[i]&&!fl.includes(q.id))return'';const u=a[q.id]===undefined?'미응답':`${L[a[q.id]]} ${q.o[a[q.id]]}`,c=`${L[q.a]} ${q.o[q.a]}`;return `<div class="rItem ${ok[i]?'ok':'no'}"><div class="rTitle">${q.id}번 · ${q.concept} — ${ok[i]?'정답':'오답'}${fl.includes(q.id)?' · 헷갈림 표시':''}</div><div class="small"><b>내 답:</b> ${u}<br><b>정답:</b> ${c}</div><div class="explain"><b>해설:</b> ${q.e}</div></div>`}).join('')||'<p>해당 문항이 없습니다.</p>'}submitBtn.addEventListener('click',submit);focusBtn.addEventListener('click',()=>{showFocusOnly=!showFocusOnly;focusBtn.textContent=showFocusOnly?'전체 문항 보기':'오답·헷갈림만 보기';renderReviews()});resetBtn.addEventListener('click',()=>{if(confirm('답안과 결과를 지우고 처음부터 다시 풀까요?')){localStorage.removeItem(KEY);location.reload()}});</script></body></html>
