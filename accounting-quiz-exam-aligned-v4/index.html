<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>중급회계 교수 출제유형 일치 3회 · 수정본</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182336;--muted:#65738a;--edge:#dfe5ee;--blue:#355dde;--bluebg:#eef2ff;--green:#067647;--greenbg:#e8f9ee;--red:#b42318;--redbg:#fff0ef;--gold:#975a12;--goldbg:#fff6e6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;line-height:1.65}.wrap{max-width:980px;margin:auto;padding:16px 13px 90px}.hero,.card{background:var(--card);border:1px solid var(--edge);border-radius:18px}.hero{padding:24px}.hero h1{font-size:26px;margin:0 0 8px;line-height:1.35}.sub,.tiny{color:var(--muted)}.sub{margin:0;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 0}.chip{background:var(--bluebg);border-radius:999px;font-size:13px;color:var(--blue);padding:5px 10px;font-weight:750}.sticky{position:sticky;top:0;z-index:30;padding:10px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}.progressbox{display:flex;gap:12px;align-items:center;border:1px solid var(--edge);border-radius:12px;padding:11px 14px;background:var(--card)}.timer{font-weight:900;font-variant-numeric:tabular-nums;min-width:62px}.track{height:8px;border-radius:99px;background:#e5eaf3;flex:1;overflow:hidden}.fill{height:100%;background:var(--blue);width:0}.answered{font-size:13px;white-space:nowrap;color:var(--muted)}.jump{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:6px;padding:8px 0 12px}.jump a{font-size:12px;text-align:center;text-decoration:none;color:var(--muted);background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:5px}.jump a.done{background:var(--bluebg);color:var(--blue);border-color:#aabcf9}.question{padding:19px;margin:12px 0}.qtitle{display:flex;align-items:center;justify-content:space-between;gap:8px}.qnum{font-weight:900;color:var(--blue)}.kind{border-radius:99px;padding:2px 8px;background:#eff2f7;color:#526179;font-size:12px}.stem{font-size:17px;font-weight:740;white-space:pre-line;margin:14px 0}.option{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:var(--bluebg)}.option input{margin-top:5px;accent-color:var(--blue)}.no{font-weight:900;min-width:20px}.extras{border-top:1px dashed var(--edge);margin-top:14px;padding-top:13px}.extras details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:750}.extras p{font-size:12px;color:var(--muted);margin:7px 0}.doubts{display:flex;gap:7px;flex-wrap:wrap}.doubts label{border:1px solid var(--edge);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}.doubts label:has(input:checked){background:var(--goldbg);border-color:#f9b650;color:var(--gold)}textarea{display:block;width:100%;border:1px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);padding:10px;resize:vertical;font-family:inherit;margin-top:9px;min-height:55px}.actions{padding:23px;text-align:center;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--edge)}.hidden{display:none!important}#result{display:none}.resultcard,.reviewcard{padding:22px;margin-top:13px}.score{font-size:52px;line-height:1.2;font-weight:950}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.metric{border:1px solid var(--edge);border-radius:12px;padding:12px}.mtop{display:flex;justify-content:space-between;font-weight:800;font-size:14px}.bar{height:8px;background:#e6eaf2;border-radius:99px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--blue)}.vital{border-left:4px solid #dc8a19;background:var(--goldbg);padding:12px;border-radius:10px;margin:9px 0}.rline{padding:13px 14px;border:1px solid var(--edge);border-radius:12px;margin:11px 0}.rline.wrong{background:var(--redbg);border-color:#f4b5b0}.rline.right{background:var(--greenbg);border-color:#abe0bd}.rtitle{font-weight:900}.details{font-size:14px}.source{font-size:12px;color:var(--muted);margin-top:6px}.rline b{font-weight:850}.topactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}#copyStatus{font-size:13px;color:var(--muted)}@media(max-width:650px){.hero h1{font-size:21px}.jump{grid-template-columns:repeat(9,minmax(0,1fr))}.metrics{grid-template-columns:1fr}.question{padding:15px}.stem{font-size:16px}.answered{display:none}}
@media(prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#171f2b;--ink:#edf2fb;--muted:#a2aec1;--edge:#2d394b;--blue:#89a3ff;--bluebg:#203252;--greenbg:#14342a;--redbg:#391f24;--goldbg:#332611}.kind{background:#283348;color:#b8c4d7}.track,.bar{background:#2b3544}}
</style></head><body><div class="wrap"><header class="hero"><h1>중급회계 실전 모의고사 3회 <span style="color:var(--blue)">출제유형 일치 수정본</span></h1><p class="sub">교수님이 알려준 1번부터 25번까지의 출제유형을 순서대로 반영했습니다. PPT 예제가 있는 계산문제는 예제 풀이구조를 활용하되 수치와 조건만 변형했습니다.</p><div class="chips"><span class="chip">25문항 · 5지선다</span><span class="chip">난도 중상~상</span><span class="chip">50분 권장</span><span class="chip">정답 제출 후 공개</span><span class="chip">선지별 헷갈림 메모</span></div></header><div class="sticky"><div class="progressbox"><span class="timer" id="timer">50:00</span><div class="track"><div class="fill" id="fill"></div></div><span id="answered" class="answered">0/25</span></div><nav id="jump" class="jump"></nav></div><main id="questions"></main><section class="card actions" id="submitSection"><button type="button" class="btn primary" id="submitBtn">25문항 제출 · 자동 채점</button><p class="sub" style="margin-top:8px">답안은 브라우저에 자동 저장되며 미응답 문항이 있어도 확인 후 제출할 수 있습니다.</p></section><section id="result"><div class="card resultcard"><h2>시험 결과</h2><div class="score"><span id="points">0</span><small style="font-size:20px"> / 100</small></div><p class="sub" id="overall"></p><div class="metrics" id="metrics"></div><div class="topactions"><button class="btn secondary" type="button" id="toggleFocus">오답·헷갈린 선지만 보기</button><button class="btn secondary" type="button" id="copyReport">진단 결과 복사하기</button><button class="btn secondary" type="button" id="reset">새로 풀기</button><span id="copyStatus"></span></div></div><div class="card reviewcard"><h2>우선 복습 개념</h2><div id="weak"></div></div><div class="card reviewcard"><h2>문항·선지별 상세 해설</h2><div id="reviews"></div></div></section></div><script>
const QS=[{"id":1,"area":"회계환경·기준","concept":"IFRS 특징","stem":"국제회계기준(IFRS)의 특징에 관한 설명 중 옳지 않은 것은?","options":["구체적 회계처리 지침보다는 원칙을 제시하고 전문가의 판단을 중시한다.","연결재무제표 중심의 재무보고를 중시한다.","적용 과정에서 판단의 여지가 있으므로 정보이용자 보호를 위한 공시를 강화한다.","원칙중심 접근법을 보완하기 위해 업종별 독립적인 회계처리기준을 폭넓게 마련한다.","공정가치 회계의 적용을 확대하는 방향을 취한다."],"answer":3,"explain":"교수자료의 IFRS 특징은 원칙주의, 전문가 판단, 산업별기준 배제, 연결재무제표 중심, 공시강화, 공정가치 확대다. 산업별 독립기준을 늘린다는 내용이 틀리다.","source":"제1장 슬라이드24","kind":"개념"},{"id":2,"area":"회계환경·기준","concept":"회계정보의 기능","stem":"회계정보의 기능과 사례의 연결 중 옳지 않은 것은?","options":["회계정보를 통해 예상수익과 위험을 판단하는 것은 정보제공기능과 관련된다.","외부주주가 경영자가 맡은 자원의 운영 결과를 확인하는 것은 수탁기능과 관련된다.","자원을 효율적으로 이용하는 기업에 자본이 흘러가게 하는 것은 정보제공기능과 관련된다.","경영자가 재무상태와 경영성과를 주주에게 보고하는 것은 수탁기능과 관련된다.","투자자가 기업별 자금배분의 효율성을 판단하는 것은 수탁기능과 관련된다."],"answer":4,"explain":"투자자의 자금배분 결정은 정보제공기능이다. 수탁기능은 경영자가 주주에게 위임받은 자원의 운용 결과를 보고하는 기능이다.","source":"제1장 슬라이드7","kind":"개념"},{"id":3,"area":"회계환경·기준","concept":"재무보고와 재무제표","stem":"재무보고에 관한 설명 중 옳지 않은 것은?","options":["재무제표는 재무보고의 중심수단이다.","현금흐름표는 기본재무제표에 포함된다.","경영자예측이나 경영자서한은 재무제표 외의 재무보고 수단이 될 수 있다.","사회·환경적 영향에 관한 설명은 재무제표 자체를 구성하는 필수 표이므로 별도 재무보고 수단으로 분류하지 않는다.","주석은 재무제표의 구성요소에 포함된다."],"answer":3,"explain":"교수자료에서는 사회·환경적 영향에 관한 설명을 사업보고서·경영자예측·경영자서한과 함께 재무보고의 기타수단으로 구분한다.","source":"제1장 슬라이드6","kind":"개념"},{"id":4,"area":"재무제표","concept":"재무제표 작성·표시","stem":"재무제표의 작성과 표시 원칙에 관한 설명 중 옳지 않은 것은?","options":["K-IFRS를 준수하는 경우 공정하게 표시한 것으로 본다.","전체 재무제표는 적어도 매년 작성하고 비교정보를 제공한다.","현금흐름표를 제외한 나머지 재무제표에는 발생기준회계를 적용한다.","재무제표의 표시와 분류는 원칙적으로 기간 간 계속성을 유지한다.","동일한 거래에서 발생한 자산과 부채는 중요성 판단 없이 상계표시하는 것이 원칙이다."],"answer":4,"explain":"상계금지가 원칙이다. 자산과 부채, 수익과 비용을 임의로 상계하지 않는다.","source":"제3장 슬라이드5","kind":"개념"},{"id":5,"area":"회계환경·기준","concept":"GAAP","stem":"일반적으로 인정된 회계원칙(GAAP)에 관한 설명 중 옳지 않은 것은?","options":["일반목적 재무제표를 작성하는 지침으로 기능한다.","회계처리 오류를 줄이고 기업 간·기간 간 비교가능성을 높이는 데 기여한다.","회계기준서와 회계기준해석서는 GAAP의 원천이 될 수 있다.","교과서 등으로 이론적 뒷받침을 받는 방법이나 전통적 실무도 실무수용을 통해 GAAP의 원천이 될 수 있다.","실무에서 오랫동안 사용되었다는 사실은 GAAP 논의와 무관하므로 권위 있는 기준서만 유일한 근거로 취급된다."],"answer":4,"explain":"교수자료는 공식 기준서·해석서와 실무수용된 전통적 방법, 이론적 뒷받침이 있는 방법, 기타 권위 있는 보고서를 함께 제시한다.","source":"제1장 슬라이드11","kind":"개념"},{"id":6,"area":"측정·공정가치","concept":"재무제표 요소의 측정기준","stem":"재무제표 요소의 측정기준에 관한 설명 중 옳지 않은 것은?","options":["역사적원가는 최초 거래가격을 기초로 하는 측정기준이다.","공정가치는 측정일의 시장참여자 관점을 반영하는 현행가치 측정기준이다.","사용가치는 자산을 사용·처분하여 기대하는 기업특유 현금흐름의 현재가치이다.","이행가치는 부채를 다른 시장참여자에게 이전할 때 지급하는 가격을 기업특유의 측정치로 구한 것이다.","현행원가는 측정일에 동등한 자산을 취득할 때 지급할 대가 등을 반영한다."],"answer":3,"explain":"부채를 시장참여자에게 이전할 때의 가격은 공정가치 관점이다. 이행가치는 기업이 부채를 이행할 때 이전할 현금·경제적 자원의 현재가치이며 기업특유의 가정을 사용한다.","source":"제4장 슬라이드13~14","kind":"개념"},{"id":7,"area":"측정·공정가치","concept":"회계정보의 질적특성","stem":"회계정보의 질적특성에 관한 설명 중 옳지 않은 것은?","options":["목적적합성과 표현충실성은 근본적 질적특성이다.","비교가능성은 기업 간 정보뿐 아니라 동일 기업의 기간 간 비교에도 도움이 된다.","검증가능성과 적시성은 목적적합성과 표현충실성을 보강하는 특성이다.","측정불확실성이 큰 회계정보는 목적적합성이 높더라도 표현충실성 판단에 영향을 줄 수 있다.","측정치에 주관적 추정이 포함된 경우 비교가능성을 높이기 위해 근본적 질적특성인 검증가능성만 우선 확보하면 된다."],"answer":4,"explain":"검증가능성은 근본적 특성이 아니라 보강적 특성이다. 근본적 특성은 목적적합성과 표현충실성이다.","source":"제4장 질적특성 및 측정기준 선택 부분","kind":"개념"},{"id":8,"area":"측정·공정가치","concept":"공정가치 유용성","stem":"공정가치회계의 유용성에 관한 설명 중 옳지 않은 것은?","options":["공정가치는 투자자·채권자의 경제적 의사결정에 유용한 현재의 정보를 제공할 수 있다.","경영자의 매수·보유 의사결정 성과를 관련 사건이 발생한 기간에 반영하는 데 도움이 된다.","금융상품을 공정가치로 평가하면 처분시점 선택을 통한 이익거래 기회를 줄이는 데 도움이 된다.","시장가격이 없어 가치평가기법이 필요한 경우 추정·가정으로 인해 정보의 신뢰성이 약해질 수 있다.","공정가치는 추정기법을 적용할 때보다 활성시장의 가격을 관측할 때 목적적합성을 제공하지 못하므로 활성시장 가격보다 추정치를 우선한다."],"answer":4,"explain":"공시가격이 있다면 이를 이용하는 것이 기본이며, 이용할 수 없을 때 평가기법을 쓴다. 평가기법의 추정은 신뢰성을 약화시킬 수 있다.","source":"제4장 슬라이드27·29","kind":"개념"},{"id":9,"area":"재무제표","concept":"재무제표의 유용성과 한계","stem":"재무제표의 유용성과 한계에 관한 설명 중 옳지 않은 것은?","options":["재무상태표는 재무구조와 유동성을 평가하는 데 활용된다.","재무상태표는 인적자원 등 측정하기 어려운 자원을 모두 보고하지 못한다는 한계가 있다.","포괄손익계산서의 회계이익은 회계처리방법에 따라 달라질 수 있다.","포괄손익계산서는 미래현금흐름의 크기·시기·불확실성을 예측하는 데 유용할 수 있다.","회계이익은 기업의 경제학적 이익을 그대로 측정하므로 회계처리방법의 차이에도 항상 같은 이익을 나타낸다."],"answer":4,"explain":"회계이익과 경제학적 이익은 같지 않다. 또한 회계이익은 회계처리방법에 따라 달라질 수 있다.","source":"제3장 슬라이드8·14","kind":"개념"},{"id":10,"area":"재무제표","concept":"재무제표 식별정보","stem":"다음 중 재무제표 자체에 표시해야 할 식별정보가 아닌 것은?","options":["보고기업의 명칭","개별기업 재무제표인지 연결실체 재무제표인지 여부","각 재무제표 또는 주석의 대상이 되는 보고기간 종료일이나 보고기간","표시통화 및 금액표시 단위","경영자의 성명과 감사인의 서명 여부"],"answer":4,"explain":"교수자료 식별정보는 기업 명칭·개별/연결 여부·보고기간·표시통화·금액단위 5개다. 경영자와 감사인의 성명·서명은 그 목록에 없다.","source":"제3장 슬라이드6","kind":"개념"},{"id":11,"area":"재고자산","concept":"계속기록법과 실지재고조사법","stem":"다음 중 계속기록법과 실지재고조사법에 관한 설명으로 옳지 않은 것은?","options":["계속기록법은 매입과 판매가 발생할 때 재고자산계정에 직접 반영한다.","실지재고조사법은 기중에 상품매입을 매입계정에 기록한다.","실지재고조사법의 매출원가는 기초재고와 순매입에서 기말 실사재고를 차감하여 구할 수 있다.","계속기록법에서는 장부재고와 실사재고의 차이로 감모를 별도 파악할 수 있다.","실지재고조사법은 기중 장부재고를 계속 갱신하므로 매출원가와 감모손실을 자동으로 분리한다."],"answer":4,"explain":"실지재고조사법은 기중 재고자산계정이 기초재고를 유지하여 장부재고를 상시 파악하지 않는다. 따라서 감모가 매출원가에 포함될 수 있다.","source":"제6장 슬라이드9~10","kind":"개념"},{"id":12,"area":"재고자산","concept":"실지재고조사법 매출원가","stem":"다음은 20X1년 상품 거래내역이다. 기초재고 120,000원, 당기매입 320,000원, 매입운임 12,000원, 매입환출 16,000원, 매입할인 8,000원이다. 기말 장부상 재고는 107,000원이나 기말 실사재고는 99,000원이다.\n\n실지재고조사법으로 구한 당기 매출원가는?","options":["321,000원","329,000원","337,000원","313,000원","345,000원"],"answer":1,"explain":"판매가능원가=120,000+320,000+12,000−16,000−8,000=428,000원. 실지재고조사법 매출원가=428,000−99,000=329,000원. 장부재고 107,000원을 사용하면 감모 8,000원을 제외하게 된다.","source":"제6장 예제 6-1 및 계속·실지재고 비교 구조","kind":"계산"},{"id":13,"area":"재고자산","concept":"기말재고자산 포함범위","stem":"20X1년 말 창고에서 실사한 상품원가는 950,000원이다. 여기에는 다른 회사가 당사에 위탁한 상품 90,000원과 고객 검수가 완료되어 통제가 이전된 특별주문품 75,000원이 포함되어 있다. 다음 항목은 실사재고에 포함하지 않았다.\n• 당사가 수탁자에게 발송한 위탁판매상품 원가 100,000원과 발송운임 7,000원\n• FOB 선적지조건으로 매입하여 운송 중인 상품 130,000원, 매입자가 부담한 운임 5,000원\n• FOB 도착지조건으로 매입했지만 아직 도착하지 않은 상품 115,000원\n• FOB 도착지조건으로 판매해 고객에게 미도착한 상품원가 66,000원\n• 고객이 인수 여부를 결정하지 않은 시용판매상품 원가 54,000원\n\n기말 재무상태표에 표시할 재고자산금액은?","options":["1,032,000원","1,081,000원","1,147,000원","1,262,000원","1,196,000원"],"answer":2,"explain":"실사 950,000−타사 위탁 90,000−인도 완료된 주문품 75,000+당사 적송원가 107,000+선적지 매입원가 135,000+도착지조건 판매 미도착품 66,000+시용판매 54,000=1,147,000원. 도착지조건 매입 미도착품은 판매자 재고이므로 미포함.","source":"제6장 슬라이드6~8 미착품·적송품·특별판매","kind":"계산"},{"id":14,"area":"재고자산","concept":"평균법 소매재고법","stem":"평균법 소매재고법으로 당기 매출원가를 추정하려고 한다(금액 단위: 원).\n• 기초재고: 원가 36,000 / 판매가격 60,000\n• 당기매입: 원가 108,000 / 판매가격 180,000\n• 매입환출: 원가 8,000 / 판매가격 10,000\n• 매입운임 4,000, 매입할인 2,000\n• 판매가격 인상 20,000, 인상취소 5,000\n• 판매가격 인하 20,000, 인하취소 5,000\n• 당기 매출 160,000, 매출환입 10,000(순매출에서 차감)\n\n평균법 소매재고법으로 산정한 당기 매출원가는?","options":["84,000원","90,000원","96,000원","102,000원","108,000원"],"answer":1,"explain":"판매가능 원가=36+108−8+4−2=138천원. 판매가능 소매가=60+180−10+(20−5)−(20−5)=230천원. 평균 원가율=60%. 순매출=160−10=150천원. 기말 소매가=80천원, 기말 원가=48천원. 매출원가=138−48=90천원. 매입운임은 원가열에만 가산한다.","source":"제6장 예제 6-16~18 소매재고법의 원가율·인상·인하 구조","kind":"계산"},{"id":15,"area":"재고자산","concept":"후입선출법 불인정 비판","stem":"후입선출법(LIFO)을 국제회계기준이 허용하지 않는 이유나 그 비판에 관한 설명 중 옳지 않은 것은? (물가가 지속적으로 상승한다고 가정한다.)","options":["기말재고자산에 오래전에 취득한 원가가 반영될 수 있다.","일반적인 물적흐름과 반대되는 원가흐름을 나타낼 수 있다.","후입선출법의 재고층이 청산되면 오래된 낮은 원가가 매출원가에 포함되어 당기이익이 일시적으로 증가할 수 있다.","후입선출법은 선입선출법보다 기말재고를 현재 취득원가에 가깝게 표시해 재무상태의 유용성을 높인다.","후입선출법을 적용하면 선입선출법에 비해 재무상태와 영업성과가 왜곡될 가능성이 있다."],"answer":3,"explain":"물가상승기 LIFO는 과거의 낮은 취득원가가 기말재고에 남으므로 현재 취득원가를 나타내기 어렵다. LIFO 청산은 낮은 원가가 매출원가로 흘러가 이익이 커질 수 있다.","source":"제6장 슬라이드39~41 후입선출법 불허 이유","kind":"개념"},{"id":16,"area":"재고자산","concept":"재고자산 원가결정과 저가법","stem":"재고자산 회계처리에 관한 설명 중 옳지 않은 것은?","options":["상호 교환할 수 없는 재고에는 개별원가를 적용할 수 있다.","재고의 성격과 용도가 유사하다면 보관장소가 달라도 동일한 단위원가결정방법을 적용하는 것이 원칙이다.","재고자산은 원가와 순실현가능가치 중 낮은 금액으로 평가한다.","저가법은 종목별 평가가 원칙이며 유사하거나 관련된 항목은 조별 평가가 허용될 수 있다.","종목별로 산정한 평가액보다 총액 기준 평가액이 높더라도 두 기준 간 차이가 중요하지 않으면 총액 기준으로 저가법을 적용할 수 있다."],"answer":4,"explain":"총액기준의 저가법은 허용하지 않는다. 교수자료는 종목별 원칙, 유사·관련 재고의 조별기준 허용을 명시한다. 성격·용도가 유사하면 같은 원가결정방법을 적용한다.","source":"제6장 슬라이드40·44 저가법 적용","kind":"개념"},{"id":17,"area":"지분법","concept":"지분법 회계처리","stem":"관계기업투자주식에 지분법을 적용하는 회계처리에 관한 설명 중 옳지 않은 것은? (중대한 영향력을 보유하고 있으며 별도 조정사항은 없다.)","options":["관계기업이 보고한 당기순이익의 투자자 지분상당액은 지분법이익으로 인식한다.","관계기업이 당기순손실을 보고한 경우 투자기업은 원칙적으로 지분상당액만큼 투자주식 장부금액을 감소시킨다.","관계기업으로부터 현금배당을 받는 경우 지분법 적용 투자주식의 장부금액을 감소시킨다.","관계기업의 이익으로 이미 지분법이익을 인식했더라도 이후 현금배당을 받는 시점에 배당금수익을 다시 인식한다.","지분법을 적용하는 투자주식은 최초에 취득원가로 인식한다."],"answer":3,"explain":"이익 발생 시 이미 지분법이익으로 인식했다. 현금배당은 투자주식 장부금액의 회수로 보아 현금 증가·투자주식 감소로 처리하며 새로운 배당금수익을 인식하지 않는다.","source":"제5장 슬라이드48 지분법 적용","kind":"개념"},{"id":18,"area":"수익인식","concept":"할부판매 판매시점의 이익","stem":"20X1년 1월 1일 기업은 원가 3,240,000원인 상품을 인도하고 480,000원을 즉시 받았다. 나머지는 20X1년 6월 30일, 20X1년 12월 31일, 20X2년 6월 30일에 각각 1,331,000원을 받기로 하였다. 유의적인 금융요소가 있으며 6개월 유효이자율은 10%다.\n\n20X1년 1월 1일 상품판매로 인식할 매출총이익은?","options":["1,233,000원","660,000원","550,000원","70,000원","1,030,000원"],"answer":2,"explain":"세 할부금의 현재가치=1,331,000/1.1+1,331,000/1.1²+1,331,000/1.1³=1,210,000+1,100,000+1,000,000=3,310,000원. 즉시수령액 포함 매출수익=3,790,000원, 매출총이익=3,790,000−3,240,000=550,000원. 할인차금의 후속 상각은 이자수익이다.","source":"제5장 슬라이드33 금융요소가 중요한 판매거래 예제","kind":"계산"},{"id":19,"area":"수익인식","concept":"고객과의 계약 식별","stem":"고객과의 계약에서 발생하는 수익에 관한 설명 중 옳지 않은 것은?","options":["서면뿐 아니라 구두나 사업관행으로 계약이 승인될 수 있다.","고객과의 계약을 식별하려면 거래에 상업적 실질이 있어야 한다.","계약당사자가 계약을 승인하였다면 대금지급조건을 식별할 수 없어도 고객과의 계약으로 식별한다.","고객에게 이전할 재화·용역과 관련해 계약당사자의 권리를 식별할 수 있어야 한다.","기업이 권리를 갖게 될 대가의 회수가능성이 높아야 한다."],"answer":2,"explain":"계약 식별에는 승인·확약, 권리 식별, 지급조건 식별, 상업적 실질, 회수가능성 높음의 다섯 요건이 모두 필요하다. 단순 승인만으로 충분하지 않다.","source":"제5장 슬라이드8 고객과의 계약 식별","kind":"개념"},{"id":20,"area":"건설계약","concept":"진행률에 따른 당기 공사이익","stem":"기업은 20X1년 초 총계약금액 270,000,000원의 공사를 수주했다. 원가에 기초한 진행률을 사용하며 기간에 걸친 수익인식 요건을 충족한다.\n• 20X1년 당기 계약원가 50,000,000원, 연말 추정 총계약원가 200,000,000원\n• 20X2년 당기 계약원가 85,000,000원, 연말 수정 추정 총계약원가 225,000,000원\n\n20X2년의 당기 계약이익은?","options":["9,500,000원","27,000,000원","77,000,000원","94,500,000원","18,000,000원"],"answer":0,"explain":"20X1년 누적수익=270,000,000×(50/200)=67,500,000원. 20X2년 진행률=(50+85)/225=60%, 누적수익=162,000,000원, 당기 계약수익=94,500,000원. 당기 계약원가 85,000,000원을 차감하면 당기 계약이익=9,500,000원.","source":"제5장 예제 5A-2 진행률·추정원가 변경","kind":"계산"},{"id":21,"area":"수익인식","concept":"수익인식과 수행의무","stem":"수익인식에 관한 설명 중 옳지 않은 것은?","options":["현금 수취보다 재화·용역에 대한 수행의무 충족 여부가 수익인식 시점의 판단에 중요하다.","하나의 고객계약에 여러 수행의무가 포함될 수 있다.","재화가 자체적으로 구분되어도 계약상 다른 약속과 별도로 식별되지 않는다면 단일 수행의무일 수 있다.","기업이 여러 재화·용역을 통합하여 하나의 결합산출물을 제공한다면 단일 수행의무로 판단할 수 있다.","재화나 용역이 고객에게 그 자체로 효익을 제공할 수 있으면 계약 안에서 다른 약속과 구분되는지를 추가 검토할 필요가 없다."],"answer":4,"explain":"별도 수행의무로 보려면 ① 재화·용역 자체의 구별성과 ② 계약 내 다른 약속과의 식별 가능성을 모두 확인한다. 자체 효익만으로 별도 수행의무가 확정되는 것은 아니다.","source":"제5장 슬라이드9~11 수행의무 식별","kind":"개념"},{"id":22,"area":"수익인식","concept":"재화·용역 수익인식 시점","stem":"재화나 용역의 수익인식 시점에 관한 설명 중 옳지 않은 것은?","options":["청소용역처럼 고객이 기업의 수행과 동시에 효익을 소비하는 경우 일정기간에 걸쳐 수익을 인식할 수 있다.","고객이 소유한 토지 위에 자산을 건설하여 고객이 제작 중 자산을 통제한다면 일정기간에 걸쳐 수익을 인식할 수 있다.","자산이 고객 맞춤형이고 대체용도가 없더라도 완료부분에 대한 집행가능한 지급청구권이 없다면 이 사유만으로 기간인식을 할 수 없다.","상품이 고객에게 물리적으로 인도되었더라도 통제 이전 지표를 종합적으로 판단하여 한 시점 인식 여부를 검토해야 한다.","기업이 제작한 자산에 대체용도가 없기만 하면 완료부분에 대한 집행가능한 지급청구권이 없어도 기간에 걸쳐 수익을 인식한다."],"answer":4,"explain":"기간인식은 ① 고객의 동시 효익 소비 또는 ② 고객의 제작 중 자산 통제 또는 ③ 대체용도 없음과 집행가능한 대금지급청구권을 모두 충족하는 경우다. 대체용도 없음 하나만으로는 ③ 요건을 충족하지 않는다.","source":"제5장 슬라이드25~26 수익인식 시점","kind":"개념"},{"id":23,"area":"지분법","concept":"지분법 투자주식 장부금액","stem":"20X1년 1월 1일 ㈜A는 ㈜B 주식의 40%를 800,000원에 취득하고 지분법을 적용했다. ㈜B의 20X1년 당기순이익은 250,000원, 현금배당은 100,000원이었다. 20X2년에는 당기순손실 120,000원, 현금배당 60,000원이 발생했다. 다른 변동은 없다.\n\n20X2년 말 투자주식의 장부금액은?","options":["748,000원","764,000원","788,000원","812,000원","836,000원"],"answer":2,"explain":"20X1년 말=800,000+250,000×40%−100,000×40%=860,000원. 20X2년 지분법손실=48,000원, 배당에 따른 장부금액 감소=24,000원. 기말=860,000−48,000−24,000=788,000원.","source":"제5장 슬라이드48 지분법 장부금액 계산","kind":"계산"},{"id":24,"area":"수익인식","concept":"세 상품 패키지 거래가격 배분","stem":"A, B, C 세 상품은 각각 별도의 수행의무다. 개별판매가격은 A 90,000원, B 60,000원, C 50,000원이다. 패키지 거래가격은 180,000원이다. 기업은 C를 언제나 50,000원에 개별 판매하고, A와 B 두 상품을 함께 판매할 때에는 130,000원에 판매한다. 이 근거로 패키지 할인 20,000원은 A와 B에만 관련되는 것으로 판단하였다.\n\nB에 배분할 거래가격은?","options":["48,000원","50,000원","52,000원","54,000원","60,000원"],"answer":2,"explain":"C는 할인대상이 아니므로 50,000원을 그대로 배분한다. A+B 배분대가=180,000−50,000=130,000원. 상대적 개별판매가격 비율 A:B=90:60이므로 B=130,000×60/150=52,000원. 전체 3개에 단순 비례 배분한 54,000원은 함정이다.","source":"제5장 예제 5-4 및 거래가격 배분 슬라이드18~19","kind":"계산"},{"id":25,"area":"건설계약","concept":"진행률 공사이익과 당기순이익","stem":"20X1년 초 기업은 총계약금액 240,000,000원의 공사를 시작했다. 계약은 기간에 걸쳐 수익을 인식하며 원가법으로 진행률을 측정한다.\n• 20X1년 발생 계약원가 40,000,000원, 추정 총계약원가 200,000,000원\n• 20X2년 발생 계약원가 80,000,000원, 수정 추정 총계약원가 240,000,000원\n• 20X2년 공사 이외의 이자수익 3,000,000원, 판매관리비 2,000,000원 발생. 법인세·기타 거래는 무시\n\n20X2년 기업의 당기순이익(손실)은?","options":["-8,000,000원","-7,000,000원","-5,000,000원","1,000,000원","72,000,000원"],"answer":1,"explain":"20X1 누적수익=240×(40/200)=48백만원. 20X2 누적수익=240×(120/240)=120백만원 → 당기 공사수익=72백만원, 당기 계약이익=72−80=−8백만원. 회사 당기순이익=−8+3−2=−7백만원.","source":"제5장 예제 5A-2·5A-4 진행률과 기간별 손익","kind":"계산"}];

let orders=bag.orders||Object.fromEntries(QS.map(q=>[q.id,randOrder()]));bag.orders=orders;
function save(){if(!bag.submitted)localStorage.setItem(STORE,JSON.stringify(bag))}
$('questions').innerHTML=QS.map(q=>{let order=orders[q.id];return `<article class="card question" id="q${q.id}"><div class="qtitle"><span class="qnum">${q.id}. ${esc(q.concept)}</span><span class="kind">${esc(q.area)} · ${q.kind}</span></div><div class="stem">${esc(q.stem)}</div>${order.map((i,pos)=>`<label class="option"><input type="radio" name="a${q.id}" value="${i}" ${bag.answers[q.id]===i?'checked':''}><span class="no">${NUM[pos]}</span><span>${esc(q.options[i])}</span></label>`).join('')}<div class="extras"><details><summary>헷갈린 선지 표시 / 이유 메모 (선택사항)</summary><p>복수 선택 가능. 정답으로 고른 선지와 관계없이 헷갈린 것을 모두 표시해.</p><div class="doubts">${order.map((i,pos)=>`<label><input type="checkbox" data-doubt="${q.id}" value="${i}" ${(bag.confuse[q.id]||[]).includes(i)?'checked':''}> ${NUM[pos]}번 선지</label>`).join('')}</div><textarea data-note="${q.id}" placeholder="예: 운임이 원가열에 들어가는지 확신이 없었음">${esc(bag.notes[q.id]||'')}</textarea></details></div></article>`}).join('');
$('jump').innerHTML=QS.map(q=>`<a href="#q${q.id}" id="j${q.id}">${q.id}</a>`).join('');
function refresh(){let done=Object.keys(bag.answers).length; $('answered').textContent=`${done}/25 응답`; $('fill').style.width=`${done*4}%`;QS.forEach(q=>$('j'+q.id).classList.toggle('done',bag.answers[q.id]!==undefined))}refresh();
$('questions').addEventListener('change',e=>{if(!bag.started)bag.started=Date.now();if(e.target.matches('input[type=radio]'))bag.answers[Number(e.target.name.substring(1))]=Number(e.target.value);if(e.target.matches('[data-doubt]')){let id=Number(e.target.dataset.doubt);bag.confuse[id]=[...document.querySelectorAll(`[data-doubt="${id}"]:checked`)].map(x=>Number(x.value))}save();refresh()});
$('questions').addEventListener('input',e=>{if(e.target.matches('[data-note]')){bag.notes[Number(e.target.dataset.note)]=e.target.value;save()}});
const timeInterval=setInterval(()=>{if(!bag.started)return;let seconds=Math.max(0,3000-Math.floor((Date.now()-bag.started)/1000));$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000);
function grade(){let empty=QS.filter(q=>bag.answers[q.id]===undefined);if(empty.length&&!confirm(`${empty.length}문항을 아직 풀지 않았습니다. 그대로 채점할까요?`))return;bag.submitted=true;save();localStorage.removeItem(STORE);clearInterval(timeInterval);const solved=QS.map(q=>({...q,correct:bag.answers[q.id]===q.answer,flagged:(bag.confuse[q.id]||[]).length>0||!!(bag.notes[q.id]||'').trim()}));const n=solved.filter(q=>q.correct).length;$('points').textContent=n*4;$('overall').textContent=`정답 ${n}개 · 오답/미응답 ${25-n}개 · 헷갈림·메모 ${solved.filter(q=>q.flagged).length}개 (50분 타이머는 참고용)`;let groups=[...new Set(QS.map(q=>q.area)),'계산','개념'];$('metrics').innerHTML=groups.map(g=>{let a=solved.filter(q=>q.area===g||q.kind===g),c=a.filter(q=>q.correct).length,p=Math.round(c/a.length*100);return `<div class="metric"><div class="mtop"><span>${esc(g)}</span><span>${p}% · ${c}/${a.length}</span></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('');window.results=solved;render();$('submitSection').classList.add('hidden');$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'})}
function resultContent(q){let mine=bag.answers[q.id],o=orders[q.id],desc=(ix)=>ix===undefined?'미응답':NUM[o.indexOf(ix)]+' '+q.options[ix];let doubts=bag.confuse[q.id]||[];return `<div class="rline ${q.correct?'right':'wrong'}"><div class="rtitle">${q.id}번 · ${esc(q.concept)} · ${q.correct?'정답':'오답'}${q.flagged?' · 헷갈림 기록':''}</div><div class="details"><b>내 답:</b> ${esc(desc(mine))}<br><b>정답:</b> ${esc(desc(q.answer))}<br>${doubts.length?`<b>헷갈린 선지:</b> ${doubts.map(i=>NUM[o.indexOf(i)]).join(', ')}<br>`:''}${bag.notes[q.id]?`<b>메모:</b> ${esc(bag.notes[q.id])}<br>`:''}<b>정답 근거:</b> ${esc(q.explain)}</div><div class="source">교수자료 참조: ${esc(q.source)}</div></div>`}
function render(){const a=window.results;let weak=a.filter(x=>!x.correct||x.flagged);$('weak').innerHTML=weak.length?weak.map(q=>`<div class="vital"><strong>${q.id}번 · ${esc(q.concept)}</strong><span style="font-size:12px">${q.correct?'정답이지만 헷갈림':'오답'}</span><div style="font-size:14px">${esc(q.explain)}</div></div>`).join(''):'<p>오답과 헷갈림 표시가 없어요. 다른 숫자·조건으로 반복 점검해보면 좋아요.</p>';$('reviews').innerHTML=a.filter(q=>!focus||!q.correct||q.flagged).map(resultContent).join('')}
$('submitBtn').addEventListener('click',grade);$('toggleFocus').onclick=()=>{focus=!focus;$('toggleFocus').textContent=focus?'전체 해설 보기':'오답·헷갈린 선지만 보기';render()};$('reset').onclick=()=>{if(confirm('기존 답안을 지우고 다시 풀까요?')){localStorage.removeItem(STORE);location.reload()}};
$('copyReport').onclick=async()=>{const lines=[`중급회계 교수 출제유형 일치 모의고사 3회 수정본: ${window.results.filter(q=>q.correct).length*4}/100`,...window.results.filter(q=>!q.correct||q.flagged).map(q=>`${q.id}번 ${q.concept} / ${q.correct?'정답·헷갈림':'오답'} / 선택 ${bag.answers[q.id]===undefined?'미응답':NUM[orders[q.id].indexOf(bag.answers[q.id])]} / 헷갈린 선지 ${(bag.confuse[q.id]||[]).map(i=>NUM[orders[q.id].indexOf(i)]).join(',')||'-'} / 이유: ${bag.notes[q.id]||'-'}`)];const txt=lines.join('\n');try{await navigator.clipboard.writeText(txt);$('copyStatus').textContent='복사 완료 — 채팅에 붙여 넣어줘'}catch(e){let el=document.createElement('textarea');el.value=txt;document.body.append(el);el.select();document.execCommand('copy');el.remove();$('copyStatus').textContent='복사 시도 완료'}};
</script></body></html>
