<title>중급회계 실전 모의고사</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#152033;--muted:#667085;--line:#e4e7ec;--brand:#3157d5;--brand2:#eef2ff;--good:#067647;--goodbg:#ecfdf3;--bad:#b42318;--badbg:#fef3f2;--warn:#b54708;--warnbg:#fffaeb}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;line-height:1.55}.wrap{max-width:960px;margin:0 auto;padding:18px 14px 80px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.hero{padding:24px;margin-bottom:14px}.hero h1{margin:0 0 8px;font-size:26px}.sub{color:var(--muted);margin:0}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.meta div{border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center;background:#fafbfc}.meta b{display:block}.sticky{position:sticky;top:0;z-index:20;padding:8px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}.status{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px}.timer{font-weight:900;font-variant-numeric:tabular-nums;min-width:64px}.progress{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;flex:1}.progress>div{height:100%;width:0;background:var(--brand)}.answered{font-size:13px;color:var(--muted);white-space:nowrap}.q{padding:20px;margin:12px 0}.qhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.qnum{font-weight:900;color:var(--brand)}.tag{font-size:12px;background:#f2f4f7;padding:4px 8px;border-radius:999px;color:#475467}.stem{font-size:17px;font-weight:750;white-space:pre-line;margin-bottom:14px}.option{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}.option:hover{border-color:#a9b9ef}.option:has(input:checked){border-color:var(--brand);background:var(--brand2)}.option input{margin-top:4px;transform:scale(1.15)}.optn{font-weight:900;min-width:22px}.submitbox{padding:20px;margin-top:14px;text-align:center}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:white}.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.result{display:none}.scorecard{padding:24px}.scoreline{display:flex;align-items:flex-end;gap:10px}.score{font-size:54px;font-weight:950;line-height:1}.badge{font-weight:800;padding:6px 10px;border-radius:999px}.good{background:var(--goodbg);color:var(--good)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metricTop{display:flex;justify-content:space-between;font-weight:800}.bar{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:8px}.bar div{height:100%;background:var(--brand)}.review,.weak{padding:20px;margin-top:12px}.weakitem{padding:11px 12px;border-left:4px solid #f79009;background:#fffcf5;border-radius:8px;margin:8px 0}.rItem{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.rItem.ok{background:#fbfffc;border-color:#abefc6}.rItem.no{background:#fffdfd;border-color:#fecdca}.rTitle{font-weight:900}.small{font-size:14px;color:var(--muted)}.explain{border-top:1px dashed var(--line);margin-top:9px;padding-top:9px;font-size:14px}.hidden{display:none!important}.footActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:640px){.meta{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr}.hero h1{font-size:22px}.q{padding:16px}.stem{font-size:16px}.answered{display:none}}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b23;--text:#f0f3f6;--muted:#9da7b3;--line:#2b3440;--brand:#7897ff;--brand2:#1c294d;--goodbg:#0d2a20;--badbg:#321a1c;--warnbg:#33230e}.meta div{background:#11161d}.tag{background:#222a34;color:#c5ced8}.weakitem{background:#2b2111}}
</style>

<body>
<div class="wrap">
<section class="hero">
<h1>중급회계 실전 모의고사 — 중상 난이도</h1>
<p class="sub">교수님이 알려준 1~25 출제포인트를 각각 반영. 모든 문항은 5지선다이며 계산문제는 조건을 명확히 제시했습니다.</p>
<div class="meta"><div><b>25문항</b><span>5지선다</span></div><div><b>50분</b><span>권장시간</span></div><div><b>100점</b><span>문항당 4점</span></div><div><b>중상</b><span>함정선지 포함</span></div></div>
</section>
<div class="sticky"><div class="status"><div class="timer" id="timer">50:00</div><div class="progress"><div id="pbar"></div></div><div class="answered" id="answered">0 / 25 응답</div></div></div>
<form id="quiz"></form>
<section class="card submitbox"><button class="btn primary" id="submitBtn" type="button">전체 제출하고 채점하기</button><p class="small">미응답 문항이 있으면 제출 전에 알려줍니다.</p></section>
<section class="result" id="result">
<div class="card scorecard"><h2>채점 결과</h2><div class="scoreline"><div class="score" id="score">0</div><div style="font-weight:900;font-size:20px">/ 100</div><div class="badge" id="grade"></div></div><p class="sub" id="summary"></p><div class="metrics" id="metrics"></div><div class="footActions"><button class="btn secondary" id="wrongOnly" type="button">오답만 보기</button><button class="btn secondary" id="resetBtn" type="button">처음부터 다시 풀기</button></div></div>
<div class="card weak"><h2>우선 복습 개념</h2><div id="weak"></div></div>
<div class="card review"><h2>문항별 해설</h2><div id="reviews"></div></div>
</section>
</div>
<script>
const L=['①','②','③','④','⑤'];
const qs=[
{id:1,area:'회계환경·기준',type:'개념',concept:'IFRS 특징',stem:`다음 <보기>의 국제회계기준(IFRS) 특징 중 옳은 것만을 고른 것은?\n\nㄱ. 원칙중심 접근법으로 전문가의 판단을 중시한다.\nㄴ. 산업별 회계처리기준을 세분화하여 업종별 실무지침을 강화한다.\nㄷ. 연결재무제표 중심의 회계기준을 지향한다.\nㄹ. 기준 적용의 유연성이 있는 만큼 정보이용자 보호를 위해 공시를 강화한다.\nㅁ. 공정가치회계의 적용을 확대하는 경향이 있다.`,o:['ㄱ, ㄴ, ㄷ','ㄱ, ㄷ','ㄴ, ㄹ, ㅁ','ㄱ, ㄷ, ㄹ, ㅁ','ㄱ, ㄴ, ㄷ, ㄹ, ㅁ'],a:3,e:'IFRS 핵심은 원칙주의·연결재무제표 중심·공시강화·공정가치 확대이다. 산업별 세부기준과 구체적 실무지침은 지양한다.'},
{id:2,area:'회계환경·기준',type:'개념',concept:'회계정보의 기능',stem:'다음 중 회계정보의 기능과 그 사례의 연결이 가장 적절하지 않은 것은?',o:['정보제공기능 — 투자자가 기업의 예상수익과 위험을 평가한다.','수탁기능 — 경영자가 위임받은 자원의 운용 결과를 주주에게 보고한다.','수탁기능 — 자원을 효율적으로 사용하는 기업을 식별하여 자본배분 의사결정을 지원한다.','정보제공기능 — 희소한 경제적 자원이 자본시장을 통해 효율적으로 배분되도록 돕는다.','수탁기능 — 외부주주에게 재무상태와 경영성과를 보고한다.'],a:2,e:'자원을 효율적으로 사용하는 기업을 식별하고 투자·신용 의사결정을 지원하는 것은 정보제공기능이다. 수탁기능은 위임받은 경영 결과의 보고에 초점이 있다.'},
{id:3,area:'회계환경·기준',type:'개념',concept:'재무보고와 재무제표',stem:'다음 중 재무보고에는 포함될 수 있으나 재무제표 자체의 구성요소로 보기는 어려운 항목으로만 묶인 것은?',o:['사업보고서, 경영자예측','현금흐름표, 경영자서한','자본변동표, 사회·환경적 영향에 대한 설명','주석, 사업보고서','포괄손익계산서, 경영자예측'],a:0,e:'재무보고가 재무제표보다 넓다. 사업보고서와 경영자예측은 재무보고의 기타수단이지만 재무제표 자체의 구성요소는 아니다.'},
{id:4,area:'재무제표',type:'개념',concept:'재무제표 작성·표시',stem:'다음 중 재무제표 작성과 표시에 관한 설명으로 옳지 않은 것은?',o:['K-IFRS를 준수하면 재무제표를 공정하게 표시한 것으로 본다.','중요하지 않은 항목이라도 성격이 서로 다르면 반드시 각각 별도 표시해야 하며 통합표시는 허용되지 않는다.','현금흐름표를 제외한 나머지 재무제표에는 발생기준회계를 적용한다.','전체 재무제표는 적어도 1년에 한 번 작성하고 비교정보를 제시한다.','자산·부채 및 수익·비용은 원칙적으로 상계하지 않는다.'],a:1,e:'중요하지 않은 항목은 통합하여 표시할 수 있다. 중요성·상계금지·보고빈도·비교정보·표시와 분류의 계속성을 함께 확인해야 한다.'},
{id:5,area:'회계환경·기준',type:'개념',concept:'GAAP',stem:'다음 중 일반적으로 인정된 회계원칙(GAAP)에 관한 설명으로 가장 부적절한 것은?',o:['일반목적 재무제표의 작성지침으로 기능한다.','다수의 권위 있는 지지는 오랜 관습이나 회계원칙제정기관 등에서 형성될 수 있다.','전통적으로 사용된 회계처리방법이나 이론적 뒷받침이 있는 방법도 실무수용의 근거가 될 수 있다.','회계기준제정기관이 공식적으로 발표한 기준서와 해석서만 GAAP의 원천이 되며 실무수용된 방법은 제외된다.','회계오류를 줄이고 기업 간·기간 간 비교가능성을 높이는 데 기여한다.'],a:3,e:'교수자료의 GAAP는 기준서·해석서뿐 아니라 실무에서 전통적으로 사용된 방법, 이론적 뒷받침이 있는 방법, 기타 권위 있는 보고서 등도 포괄한다.'},
{id:6,area:'측정·공정가치',type:'개념',concept:'측정기준',stem:'다음 측정기준과 설명의 연결 중 옳지 않은 것은?',o:['공정가치 — 시장참여자의 현재 기대를 반영하는 측정치','사용가치 — 자산의 사용·처분에서 발생할 것으로 예상되는 기업특유 현금흐름의 현재가치','이행가치 — 부채를 이행하는 데 필요한 기업특유 현금흐름의 현재가치','현행원가 — 측정일에 동등한 자산을 취득·창출하거나 동등한 부채를 발생·인수하는 현재의 원가','사용가치 — 시장참여자가 부채를 이전하기 위해 요구하는 가격을 기초로 하는 시장관점의 측정치'],a:4,e:'사용가치는 자산에 대한 기업특유 측정치다. 부채의 기업특유 측정치는 이행가치이며, 시장참여자 관점의 대표 측정치는 공정가치다.'},
{id:7,area:'측정·공정가치',type:'개념',concept:'질적특성',stem:'다음 중 측정기준 선택과 회계정보의 질적특성에 관한 설명으로 옳지 않은 것은?',o:['동일한 항목에 동일한 측정기준을 계속 사용하면 비교가능성이 높아질 수 있다.','관측 가능한 투입요소를 활용할수록 검증가능성이 높아질 수 있다.','측정불확실성이 높은 경우 그 영향은 목적적합성에만 관련되며 표현충실성 판단과는 관련되지 않는다.','상호 관련된 자산과 부채에 서로 다른 측정기준을 사용하면 회계불일치가 발생해 표현충실성이 낮아질 수 있다.','측정기준이 제공하는 정보의 효익은 그 정보를 제공하는 원가와 함께 고려된다.'],a:2,e:'측정불확실성이 지나치게 높으면 표현충실성을 저해할 수 있다. 따라서 표현충실성 판단과 무관하다고 할 수 없다.'},
{id:8,area:'측정·공정가치',type:'개념',concept:'공정가치의 유용성',stem:'다음 중 공정가치의 유용성과 이익거래에 관한 설명으로 옳지 않은 것은?',o:['공정가치는 시장참여자의 현재 기대를 반영하여 투자·신용판단에 목적적합한 정보를 제공할 수 있다.','공정가치 측정에서는 미실현 보유손익이 인식되지 않으므로 보유이익 상품만 처분하는 이익거래 유인이 역사적원가와 동일하게 남는다.','가치평가기법을 사용해야 하는 경우 공시가격을 직접 사용하는 경우보다 신뢰성이나 검증가능성이 낮아질 수 있다.','공정가치는 경영자의 매수·보유 의사결정 성과를 사건 발생기간에 비교적 신속히 반영할 수 있다.','모든 금융상품을 공정가치로 평가하면 이익거래 기회를 줄이는 효과가 있다.'],a:1,e:'공정가치 평가에서는 보유손익이 측정치에 반영되므로 보유이익 상품만 골라 처분해 이익을 조기 인식하는 기회를 줄일 수 있다.'},
{id:9,area:'재무제표',type:'개념',concept:'재무제표 유용성과 한계',stem:'다음 중 재무제표의 유용성과 한계에 관한 연결이 적절하지 않은 것은?',o:['재무상태표 — 유동성과 재무탄력성에 관한 정보 제공','재무상태표 — 역사적원가 사용으로 현재 공정가치를 충분히 반영하지 못할 수 있음','포괄손익계산서 — 미래현금흐름의 크기·시기·불확실성 예측에 도움','포괄손익계산서 — 회계처리방법에 따라 회계이익이 달라질 수 있음','재무상태표 — 임금협상의 기초자료 제공이 대표적 유용성이며 포괄손익계산서는 이와 관련이 적다.'],a:4,e:'임금협상 기초자료는 교수자료에서 포괄손익계산서의 유용성으로 제시된다. 재무상태표는 자원·재무구조·유동성·재무탄력성 정보가 핵심이다.'},
{id:10,area:'재무제표',type:'개념',concept:'재무제표 식별정보',stem:`다음 항목 중 재무제표에 표시해야 할 식별정보에 해당하는 것은 몇 개인가?\n\nㄱ. 보고기업의 명칭\nㄴ. 대표이사의 성명\nㄷ. 개별기업 재무제표인지 연결실체 재무제표인지 여부\nㄹ. 보고기간 종료일 또는 보고기간\nㅁ. 표시통화\nㅂ. 감사인의 성명\nㅅ. 금액표시 단위`,o:['3개','4개','5개','6개','7개'],a:2,e:'식별정보는 보고기업 명칭, 개별/연결 여부, 보고기간 종료일 또는 보고기간, 표시통화, 금액표시 단위의 5개다.'},
{id:11,area:'재고자산',type:'개념',concept:'계속기록법·실지재고조사법',stem:'다음 중 계속기록법과 실지재고조사법에 관한 설명으로 옳지 않은 것은?',o:['실지재고조사법은 기중에 장부상 기말재고수량을 계속 갱신하므로 감모손실을 매출원가와 별도로 파악하는 데 유리하다.','계속기록법은 매입과 판매 시 재고자산계정에 직접 기록한다.','실지재고조사법에서는 매입을 매입계정에 기록하고 재고자산계정은 결산 전까지 기초재고액을 유지한다.','실지재고조사법의 매출원가는 기초재고액+당기매입액-기말 실사재고액으로 산출할 수 있다.','계속기록법에서는 장부재고와 실사재고를 비교하여 감모를 별도로 파악할 수 있다.'],a:0,e:'실지재고조사법은 기중 장부수량을 상시 갱신하지 않는다. 따라서 감모가 기말 실사재고 감소를 통해 매출원가에 포함될 수 있다.'},
{id:12,area:'재고자산',type:'계산',concept:'매출원가·감모',stem:`기초재고 80,000원, 당기매입 220,000원, 매입운임 10,000원, 매입환출 20,000원, 매입할인 5,000원이다. 계속기록법상 결산 직전 장부상 기말재고는 95,000원이고 기말 실사재고는 88,000원이다.\n\n계속기록법상 판매 시점까지 기록된 매출원가, 재고감모손실, 실지재고조사법상 매출원가의 조합으로 옳은 것은?`,o:['183,000원 / 7,000원 / 190,000원','190,000원 / 0원 / 197,000원','197,000원 / 7,000원 / 197,000원','190,000원 / 7,000원 / 197,000원','190,000원 / 7,000원 / 190,000원'],a:3,e:'판매가능원가=80+220+10-20-5=285천원. 계속법 판매시점 COGS=285-95=190천원, 감모=95-88=7천원. 실지법 COGS=285-88=197천원.'},
{id:13,area:'재고자산',type:'계산',concept:'재고자산 포함범위',stem:`기말 실사재고 1,000,000원에는 다른 회사가 당사에 판매를 위탁한 상품 70,000원과, 생산·고객검수가 모두 완료되어 소유권이 고객에게 이전된 특별주문품 110,000원이 포함되어 있다.\n\n다음 항목은 실사재고에 포함되지 않았다.\n• 당사가 수탁자에게 보낸 위탁상품 원가 120,000원과 발송비 5,000원\n• FOB 선적지조건으로 매입하여 운송 중인 상품 원가 90,000원과 당사 부담 매입운임 4,000원\n• FOB 도착지조건으로 판매하여 고객에게 아직 도착하지 않은 상품 원가 60,000원\n• 시용판매로 보냈으나 고객이 아직 매입의사를 표시하지 않은 상품 원가 40,000원\n\n재무제표에 표시할 기말재고자산은?`,o:['1,069,000원','1,139,000원','1,154,000원','1,209,000원','1,249,000원'],a:1,e:'1,000,000-70,000-110,000+125,000+94,000+60,000+40,000=1,139,000원. 실물 위치보다 소유권·통제 판단이 핵심이다.'},
{id:14,area:'재고자산',type:'계산',concept:'평균법 소매재고법',stem:`평균법 소매재고법을 적용한다. 자료는 다음과 같다.\n\n기초재고: 원가 20,000원 / 소매가 32,000원\n당기매입: 원가 70,000원 / 소매가 108,000원\n매입환출: 원가 4,000원 / 소매가 8,000원\n매입운임: 원가 5,000원\n순인상: 12,000원\n순인하: 4,000원\n순매출: 80,000원\n\n당기 매출원가는?`,o:['48,000원','49,500원','50,700원','55,000원','52,000원'],a:4,e:'판매가능원가=91,000원, 소매가=140,000원 → 원가율 65%. 기말재고 소매가=60,000원 → 원가 39,000원. 매출원가=91,000-39,000=52,000원.'},
{id:15,area:'재고자산',type:'개념',concept:'후입선출법',stem:`물가가 지속적으로 상승하는 상황을 가정한다. 다음 설명 중 옳은 것만을 고른 것은?\n\nㄱ. 일반적으로 기말재고는 FIFO가 LIFO보다 크다.\nㄴ. 일반적으로 매출원가는 FIFO가 LIFO보다 작다.\nㄷ. 일반적으로 당기순이익은 FIFO가 LIFO보다 크다.\nㄹ. LIFO 청산이 발생하면 과거의 낮은 원가가 매출원가로 흘러가 당기이익이 일시적으로 커질 수 있다.\nㅁ. 실제 물적흐름이 후입선출과 유사하면 IFRS에서도 LIFO를 적용할 수 있다.`,o:['ㄱ, ㄴ','ㄱ, ㄷ, ㄹ','ㄱ, ㄴ, ㄷ, ㄹ','ㄴ, ㄷ, ㅁ','ㄱ, ㄴ, ㄷ, ㄹ, ㅁ'],a:2,e:'물가상승기에는 기말재고 FIFO>LIFO, COGS FIFO<LIFO, 이익 FIFO>LIFO. LIFO 청산은 옛날 저가 재고가 COGS로 흘러가 이익이 일시적으로 증가할 수 있으며 IFRS는 LIFO를 허용하지 않는다.'},
{id:16,area:'재고자산',type:'개념',concept:'재고자산 측정·저가법',stem:'다음 중 재고자산의 원가결정 및 저가법에 관한 설명으로 옳지 않은 것은?',o:['상호 교환될 수 없는 재고나 특정 프로젝트를 위해 생산·분리된 재화에는 개별법을 적용할 수 있다.','성격과 용도가 유사한 재고에는 동일한 단위원가 결정방법을 사용하는 것이 원칙이다.','순실현가능가치는 추정판매가격에서 완성에 필요한 원가와 판매에 필요한 원가를 차감하여 산정한다.','종목별 저가법 적용 결과와 총액기준 적용 결과가 유사하다면 전체 재고자산에 총액기준을 적용할 수 있다.','순실현가능가치가 회복되면 과거 평가손실은 최초 장부금액을 한도로 환입할 수 있다.'],a:3,e:'K-IFRS의 원칙은 종목별 기준이며 유사·관련 재고는 조별기준이 허용될 수 있지만 총액기준은 허용되지 않는다.'},
{id:17,area:'지분법',type:'개념',concept:'지분법 기본',stem:'투자기업이 관계기업의 의결권 30%를 보유하여 지분법을 적용한다. 다음 회계처리 중 옳지 않은 것은?',o:['관계기업이 현금배당 40,000원을 하면 투자기업은 배당금수익 12,000원을 인식하고 투자주식 장부금액은 유지한다.','관계기업이 당기순이익 100,000원을 보고하면 지분법이익 30,000원을 인식하고 투자주식 장부금액을 증가시킨다.','관계기업의 배당은 이미 투자주식 장부금액에 반영된 가치 일부를 현금으로 회수하는 성격으로 본다.','관계기업이 당기순손실 50,000원을 보고하면 지분법손실 15,000원을 인식하고 투자주식 장부금액을 감소시킨다.','최초 투자 시 투자주식은 투자원가로 기록한다.'],a:0,e:'지분법에서 배당은 새로운 수익이 아니라 투자금 회수로 본다. 현금은 증가하고 투자주식 장부금액은 감소하며 당기손익에는 새로 반영하지 않는다.'},
{id:18,area:'수익인식',type:'계산',concept:'할부판매·현재가치',stem:`20X1년 1월 1일 원가 3,200,000원의 상품을 할부판매하였다. 계약일에 500,000원을 즉시 받고, 20X1년 6월 30일, 20X1년 12월 31일, 20X2년 6월 30일에 각각 1,331,000원을 받기로 하였다. 6개월 유효이자율은 10%이다.\n\n판매시점의 매출수익과 매출총이익의 조합으로 옳은 것은?`,o:['매출수익 3,310,000원 / 매출총이익 110,000원','매출수익 3,810,000원 / 매출총이익 610,000원','매출수익 4,493,000원 / 매출총이익 1,293,000원','매출수익 3,500,000원 / 매출총이익 300,000원','매출수익 3,810,000원 / 매출총이익 3,310,000원'],a:1,e:'미래대금 PV=1,210,000+1,100,000+1,000,000=3,310,000원. 즉시 수령액 500,000원을 더하면 매출수익 3,810,000원, 원가를 빼면 매출총이익 610,000원.'},
{id:19,area:'수익인식',type:'개념',concept:'고객과의 계약 식별',stem:'다음 중 K-IFRS 제1115호상 고객과의 계약으로 식별할 수 있는 경우는?',o:['당사자들이 계약을 승인했지만 이전할 재화·용역에 관한 각 당사자의 권리를 식별하기 어렵다.','권리와 지급조건은 식별되지만 거래가 기업의 경제적 상황에 실질적인 변화를 가져오지 않는다.','당사자들이 계약을 승인했고 권리·지급조건도 식별되지만 대가의 회수가능성이 높다고 판단하기 어렵다.','구두로 승인된 계약으로 당사자가 의무 수행을 확약했고, 권리와 지급조건이 식별되며 상업적 실질이 있고 대가의 회수가능성도 높다.','모든 경제적 조건은 충족되지만 당사자들이 각자의 의무를 수행하기로 확약하지 않았다.'],a:3,e:'계약 식별 5요건은 승인·확약, 권리 식별, 지급조건 식별, 상업적 실질, 대가 회수가능성 높음이다. 계약은 서면뿐 아니라 구두나 관행으로도 승인될 수 있다.'},
{id:20,area:'건설계약',type:'계산',concept:'진행률·당기계약이익',stem:`총계약금액 150,000,000원의 건설계약에 원가법을 적용한다.\n\n20X1년: 당기 발생 계약원가 30,000,000원, 연말 추정 총계약원가 100,000,000원\n20X2년: 당기 발생 계약원가 45,000,000원, 연말 수정 추정 총계약원가 120,000,000원\n\n20X2년의 당기 계약이익은?`,o:['18,750,000원','48,750,000원','3,000,000원','4,500,000원','3,750,000원'],a:4,e:'X1 진행률 30% → 누적수익 45,000,000원. X2 누적진행률=75/120=62.5% → 누적수익 93,750,000원 → 당기수익 48,750,000원 → 당기이익 3,750,000원.'},
{id:21,area:'수익인식',type:'개념',concept:'수행의무 식별',stem:'다음 중 수익인식과 수행의무에 관한 설명으로 옳지 않은 것은?',o:['수익은 현금 수취시점 자체가 아니라 수익인식 요건이 충족되는 시점을 기준으로 인식한다.','패키지 거래에는 하나의 계약 안에 여러 수행의무가 존재할 수 있다.','재화·용역이 고객에게 자체적으로 효익을 제공할 수 있으면 계약 안에서 다른 약속과 별도로 식별되는지와 관계없이 반드시 별도 수행의무로 본다.','기업이 여러 재화·용역을 유의적으로 통합하여 하나의 결합산출물을 제공한다면 단일 수행의무로 판단할 수 있다.','재화·용역의 상호의존도나 상호관련성이 매우 높으면 단일 수행의무로 판단할 수 있다.'],a:2,e:'별도 수행의무가 되려면 재화·용역 자체가 뚜렷이 구분될 뿐 아니라 계약 안에서도 다른 약속과 별도로 식별 가능해야 한다.'},
{id:22,area:'수익인식',type:'개념',concept:'수익인식 시점',stem:"다음 거래 중 수행의무를 '한 시점'에 충족하는 거래로 보는 것이 가장 적절한 것은?",o:['기업이 일반시장 판매를 위해 표준화된 상품을 자기 창고에 생산하며 특정 고객은 생산 중 자산을 통제하지 않는다.','매일 제공되는 청소용역으로 고객이 서비스 제공과 동시에 효익을 소비한다.','고객 소유 토지 위에 자산을 건설하며 건설 중 자산을 고객이 통제한다.','고객 맞춤형 특수장비로 대체용도가 없고 지금까지 수행한 부분에 대해 집행가능한 지급청구권이 있다.','케이블TV 서비스로 고객이 기간 중 효익을 동시에 얻고 소비한다.'],a:0,e:'일반시장 판매용 표준화 상품은 기간에 걸친 인식 3요건에 해당하지 않으므로 통제가 고객에게 이전되는 한 시점에 수익을 인식한다.'},
{id:23,area:'지분법',type:'계산',concept:'지분법 장부금액',stem:`㈜A는 20X1년 초 ㈜B의 의결권 있는 주식 40%를 900,000원에 취득하고 지분법을 적용한다.\n20X1년 ㈜B의 당기순이익은 300,000원, 현금배당은 100,000원이다.\n20X2년 ㈜B의 당기순이익은 150,000원, 현금배당은 120,000원이다.\n\n20X2년에 인식할 지분법이익과 20X2년 말 투자주식 장부금액의 조합으로 옳은 것은?`,o:['지분법이익 60,000원 / 장부금액 1,040,000원','지분법이익 60,000원 / 장부금액 992,000원','지분법이익 12,000원 / 장부금액 992,000원','배당금수익 48,000원 / 장부금액 1,040,000원','지분법이익 108,000원 / 장부금액 992,000원'],a:1,e:'X1 말 장부금액=900+120-40=980천원. X2 지분법이익=60천원, 배당에 따른 감소=48천원 → 기말 992천원. 지분법이익과 장부금액 순증가액 12천원을 구분해야 한다.'},
{id:24,area:'수익인식',type:'계산',concept:'패키지 거래가격 배분',stem:`서로 별도 수행의무인 A, B, C의 개별판매가격은 각각 90,000원, 60,000원, 30,000원이다. 세 제품을 패키지로 150,000원에 판매한다. C는 단독판매 시 30,000원에 판매되고 A와 B를 함께 판매할 때는 통상 120,000원에 판매하므로 패키지 할인은 A와 B에만 관련된 것으로 판단된다.\n\nB에 배분할 거래가격은?`,o:['45,000원','50,000원','60,000원','54,000원','48,000원'],a:4,e:'C에는 30,000원을 그대로 배분한다. 남은 120,000원을 A:B=90:60=3:2로 배분하므로 B는 120,000×2/5=48,000원이다. 전체 3개에 상대가격법을 적용하는 것이 함정이다.'},
{id:25,area:'건설계약',type:'계산',concept:'진행률·당기순이익',stem:`총계약금액 180,000,000원의 건설계약에 원가법을 적용한다.\n\n20X1년: 당기 계약원가 36,000,000원, 추정 총계약원가 120,000,000원\n20X2년: 당기 계약원가 54,000,000원, 수정 추정 총계약원가 135,000,000원\n\n20X2년에는 이 건설계약 외에 이자수익 4,000,000원과 판매관리비 3,000,000원이 발생했다. 법인세는 무시한다.\n\n20X2년 당기순이익은?`,o:['12,000,000원','16,000,000원','9,000,000원','13,000,000원','66,000,000원'],a:3,e:'X1 누적수익=180×30%=54백만원. X2 누적진행률=90/135=66.67% → 누적수익 120백만원 → 당기 계약수익 66백만원 → 계약이익 12백만원. 당기순이익=12+4-3=13백만원.'}
];
const form=document.getElementById('quiz');
form.innerHTML=qs.map(q=>`<section class="card q" id="q${q.id}"><div class="qhead"><div class="qnum">${q.id}번</div><div><span class="tag">${q.area}</span> <span class="tag">${q.type}</span></div></div><div class="stem">${q.stem}</div>${q.o.map((x,i)=>`<label class="option"><input type="radio" name="q${q.id}" value="${i}"><span class="optn">${L[i]}</span><span>${x}</span></label>`).join('')}</section>`).join('');
const KEY='acct_mock_v3';let start=Date.now(),end=start+50*60*1000,wrongOnly=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.end&&s.answers){end=s.end;Object.entries(s.answers).forEach(([id,v])=>{const el=document.querySelector(`input[name=q${id}][value="${v}"]`);if(el)el.checked=true})}}catch(e){}
function state(){const a={};qs.forEach(q=>{const e=document.querySelector(`input[name=q${q.id}]:checked`);if(e)a[q.id]=+e.value});return a}
function save(){localStorage.setItem(KEY,JSON.stringify({end,answers:state()}));update()}
function update(){const n=Object.keys(state()).length;document.getElementById('answered').textContent=`${n} / 25 응답`;document.getElementById('pbar').style.width=`${n/25*100}%`}
form.addEventListener('change',save);update();
setInterval(()=>{let s=Math.max(0,Math.floor((end-Date.now())/1000));document.getElementById('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);
function pct(c,n){return n?Math.round(c/n*100):0}function level(p){return p>=90?['매우 안정','good']:p>=75?['보완 필요','warn']:['집중 복습','bad']}
function submit(){const a=state(),missing=25-Object.keys(a).length;if(missing&& !confirm(`미응답 ${missing}문항이 있습니다. 그래도 제출할까요?`))return;const flags=qs.map(q=>a[q.id]===q.a),correct=flags.filter(Boolean).length,score=correct*4;document.getElementById('score').textContent=score;const [t,c]=level(score);const g=document.getElementById('grade');g.textContent=t;g.className=`badge ${c}`;document.getElementById('summary').textContent=`정답 ${correct}개 · 오답/미응답 ${25-correct}개`;
const groups=['회계환경·기준','측정·공정가치','재무제표','재고자산','지분법','수익인식','건설계약'];document.getElementById('metrics').innerHTML=groups.map(name=>{const idx=qs.map((q,i)=>q.area===name?i:-1).filter(i=>i>=0),c=idx.filter(i=>flags[i]).length,p=pct(c,idx.length);return `<div class="metric"><div class="metricTop"><span>${name}</span><span>${p}% (${c}/${idx.length})</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join('')+['개념','계산'].map(name=>{const idx=qs.map((q,i)=>q.type===name?i:-1).filter(i=>i>=0),c=idx.filter(i=>flags[i]).length,p=pct(c,idx.length);return `<div class="metric"><div class="metricTop"><span>${name}문제</span><span>${p}% (${c}/${idx.length})</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join('');
const wrong=qs.map((q,i)=>({q,i})).filter(x=>!flags[x.i]);document.getElementById('weak').innerHTML=wrong.length?wrong.slice(0,8).map(x=>`<div class="weakitem"><b>${x.q.id}번 · ${x.q.concept}</b><br>${x.q.e}</div>`).join(''):'<div class="weakitem" style="border-left-color:#12b76a;background:var(--goodbg)"><b>취약개념 없음</b><br>25문항 모두 정답입니다.</div>';
window._flags=flags;window._answers=a;renderReviews();document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'});localStorage.removeItem(KEY)}
function renderReviews(){const a=window._answers||{},f=window._flags||[];document.getElementById('reviews').innerHTML=qs.map((q,i)=>{if(wrongOnly&&f[i])return'';const u=a[q.id]===undefined?'미응답':`${L[a[q.id]]} ${q.o[a[q.id]]}`,c=`${L[q.a]} ${q.o[q.a]}`;return `<div class="rItem ${f[i]?'ok':'no'}"><div class="rTitle">${q.id}번 · ${q.concept} — ${f[i]?'정답':'오답'}</div><div class="small"><b>내 답:</b> ${u}<br><b>정답:</b> ${c}</div><div class="explain"><b>해설:</b> ${q.e}</div></div>`}).join('')||'<p>오답이 없습니다.</p>'}
document.getElementById('submitBtn').onclick=submit;document.getElementById('wrongOnly').onclick=()=>{wrongOnly=!wrongOnly;document.getElementById('wrongOnly').textContent=wrongOnly?'전체 문항 보기':'오답만 보기';renderReviews()};document.getElementById('resetBtn').onclick=()=>{if(confirm('답안과 결과를 지우고 처음부터 다시 풀까요?')){localStorage.removeItem(KEY);location.reload()}};
</script>
