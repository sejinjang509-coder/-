    <title>Re:Balance AI · 정책금융을 설계하는 AI</title>

    <!-- REBALANCE:STYLES:START -->
    <style>
:root {
  color-scheme: dark;
  --background: #10332c;
  --mint: #b9dfc4;
  --cream: #f0ebd8;
  --muted: #7fa99a;
  --gold: #e3c26b;
  --risk: #ed8a5c;
  --dark: #15332d;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --duration: 800ms;
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--cream); }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 5px; border-radius: 4px; }
button:disabled { cursor: default; }
.svg-library { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.experience { width: min(1440px, calc(100% - 80px)); margin: 0 auto; padding: 28px 0 20px; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; }
.masthead { display: flex; align-items: center; justify-content: space-between; padding: 0 3px 24px; }
.wordmark { display: inline-flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
.brand-icon { color: var(--mint); width: 29px; height: 29px; }
.wordmark-ai { font-weight: 400; color: var(--mint); }
.masthead-note { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; isolation: isolate; overflow: hidden; container-type: inline-size; border: 1px solid rgb(127 169 154 / .17); border-radius: 3px; }
.orbit { position: absolute; border: 1px solid rgb(127 169 154 / .065); border-radius: 50%; pointer-events: none; z-index: -1; }
.orbit-one { width: 89%; height: 72%; left: 5.5%; top: 22%; }
.orbit-two { width: 119%; height: 95%; left: -9.5%; top: 11%; }
.stage-meta { position: absolute; top: 5.2%; left: 4.5%; right: 4.5%; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: clamp(9px, 1cqw, 15px); z-index: 3; }
#chapter { letter-spacing: 1px; }
#scene-number { color: var(--cream); font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.total { color: var(--muted); }
.simulation-label { font-size: clamp(7px, .65cqw, 10px); letter-spacing: 2px; opacity: .8; }
.scene-host { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; display: flex; align-items: center; flex-direction: column; padding: 11.8% 9% 8%; opacity: 1; }
.scene.is-entering { animation: scene-enter var(--duration) var(--ease) both; }
.scene.is-leaving { animation: scene-leave var(--duration) var(--ease) both; pointer-events: none; }
.scene-title { margin: 0; flex: none; text-align: center; font-weight: 750; font-size: clamp(18px, 3.75cqw, 54px); letter-spacing: -.035em; line-height: 1.28; }
.scene-title .accent { color: var(--mint); }
.scene-kicker { margin: 1.3cqw 0 0; font-size: clamp(9px, .9cqw, 13px); letter-spacing: .1em; color: var(--muted); }
.scene-art { position: relative; flex: 1; min-height: 0; width: 100%; margin-top: 2cqw; display: flex; align-items: center; justify-content: center; }
.stage-subtitle { position: absolute; bottom: 4.5%; left: 9%; right: 9%; margin: 0; color: var(--muted); text-align: center; font-size: clamp(8px, .85cqw, 12px); letter-spacing: .025em; line-height: 1.5; z-index: 3; pointer-events: none; }
.edge-nav { position: absolute; top: 16%; bottom: 13%; width: 7%; z-index: 4; font-size: clamp(24px, 3cqw, 38px); color: var(--muted); transition: color 300ms, background 300ms; }
.edge-prev { left: 0; }
.edge-next { right: 0; }
.edge-nav span { opacity: .2; transition: opacity 300ms; }
.edge-nav:not(:disabled):hover span, .edge-nav:focus-visible span { opacity: 1; }
.edge-nav:disabled span { opacity: 0; }
.edge-nav:focus-visible { outline-offset: -6px; }
.transport { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 30px; align-items: center; padding: 21px 3px 12px; }
.playback { display: flex; align-items: center; gap: 18px; }
.play-toggle { display: inline-flex; gap: 9px; align-items: center; font-size: 11px; color: var(--mint); padding: 8px 0; white-space: nowrap; }
#play-icon { width: 11px; font-size: 14px; line-height: 1; }
#runtime { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; white-space: nowrap; }
.timeline { display: flex; gap: 6px; width: 100%; }
.timeline-button { position: relative; flex: 1; height: 30px; padding: 12px 0; }
.timeline-track { display: block; height: 2px; background: rgb(127 169 154 / .22); overflow: hidden; }
.timeline-fill { display: block; height: 100%; background: var(--mint); transform: scaleX(0); transform-origin: left; }
.timeline-button.is-complete .timeline-fill { transform: scaleX(1); background: var(--muted); }
.timeline-button[aria-current="step"] .timeline-track { background: rgb(185 223 196 / .35); }
.timeline-button:hover .timeline-track { background: var(--muted); }
.replay { justify-self: end; font-size: 10px; letter-spacing: 1.5px; color: var(--muted); padding: 9px 0 9px 9px; }
.replay span { margin-left: 7px; font-size: 15px; }
.replay:hover { color: var(--cream); }
.experience-notes { display: flex; align-items: center; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 10px; line-height: 1.6; opacity: .85; }
.experience-notes p { margin: 0; }
.mobile-hint { display: none; }
.mobile-transcript { display: none; }
.noscript { text-align: center; }

/* Shared graphic language: flat pools, paper, restrained dotted paths. */
.reveal { opacity: 0; animation: reveal 750ms var(--ease) var(--delay, 0ms) both; }
.check { display: inline-flex; color: var(--mint); }
.check .icon { width: 1.4cqw; height: 1.4cqw; }
.connector { width: 7cqw; height: 1px; border-top: 1px dashed var(--muted); opacity: .55; position: relative; flex: none; }
.connector::after { content: ""; position: absolute; right: 0; top: -2.5px; width: 4px; height: 4px; border-radius: 50%; background: var(--mint); animation: travel 2.6s var(--ease) infinite; }
.pool { position: relative; width: 23cqw; flex: none; }
.pool-shape { width: 100%; height: auto; display: block; overflow: visible; }
.pool-copy { position: absolute; top: 40%; left: 0; right: 0; color: var(--dark); text-align: center; }
.pool-label { font-size: 1cqw; font-weight: 500; }
.pool-value { font-size: 3.25cqw; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: .45cqw; }
.pool-unit { font-size: .9cqw; margin-left: .35cqw; font-weight: 500; }
.paper { width: 19cqw; background: var(--cream); color: var(--dark); padding: 1.65cqw 1.8cqw; position: relative; border-radius: 2px 2px 2px 10px; flex: none; }
.paper::before { content: ""; position: absolute; top: 0; right: 0; width: 1.6cqw; height: 1.6cqw; background: var(--mint); clip-path: polygon(0 0, 0 100%, 100% 100%); }
.paper-heading { display: flex; align-items: center; gap: .6cqw; font-size: .65cqw; letter-spacing: .1em; color: var(--background); opacity: .8; }
.paper-heading .icon { width: 1.4cqw; height: 1.4cqw; }
.paper p { font-size: 1.35cqw; font-weight: 600; line-height: 1.65; margin: 1.2cqw 0 .9cqw; }
.paper-ruling { display: block; width: 72%; height: 1px; background: rgb(127 169 154 / .35); margin-top: .55cqw; }
.paper-ruling.short { width: 44%; }
.micro-label { font-size: .7cqw; letter-spacing: .13em; color: var(--muted); }

/* 01 — finite resources between two goals. */
.dilemma-art { gap: 4.7cqw; margin-top: 1cqw; }
.goal { text-align: center; color: var(--mint); width: 12cqw; }
.goal .icon { width: 3.5cqw; height: 3.5cqw; }
.goal p { font-size: 1.1cqw; color: var(--cream); margin: .8cqw 0 .5cqw; }
.goal .up { font-size: 1.5cqw; color: var(--muted); }
.goal-line { position: absolute; top: 53%; width: 4.5cqw; border-top: 1px dashed rgb(127 169 154 / .5); }
.goal-line.left { left: 20.5%; }
.goal-line.right { right: 20.5%; }
.capacity-note { position: absolute; bottom: -.4cqw; left: 0; width: 100%; text-align: center; font-size: .75cqw; color: var(--muted); }

/* 02 — seventeen symbolic regions, a single local event. */
.signal-art { width: 75cqw; margin-top: 1.2cqw; }
.region-network { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.region-node { fill: var(--muted); opacity: .6; }
.region-name { fill: var(--muted); font-size: 12px; text-anchor: middle; font-family: inherit; }
.region-risk { animation: region-risk 900ms var(--ease) 1900ms both; }
.risk-outline { fill: none; stroke: var(--risk); stroke-width: 1; opacity: 0; animation: show-risk 800ms var(--ease) 2100ms both; }
.risk-mark { fill: var(--dark); font-weight: 700; font-size: 14px; text-anchor: middle; opacity: 0; animation: show-risk 600ms var(--ease) 2100ms both; }
.news-small { position: absolute; left: 3cqw; top: .8cqw; width: 19cqw; padding: 1.25cqw 1.5cqw; }
.news-small p { margin: .8cqw 0; font-size: 1.15cqw; }
.event-route { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 5; opacity: .7; }
.event-trace { fill: none; stroke: var(--mint); stroke-width: 2; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw-route 1800ms var(--ease) 900ms both; }
.industry-effects { position: absolute; right: 4cqw; top: 3.5cqw; display: flex; flex-direction: column; gap: .75cqw; font-size: 1cqw; color: var(--cream); }
.industry-effects span::before { content: ""; display: inline-block; width: 2cqw; border-top: 1px dashed var(--muted); vertical-align: middle; margin-right: .8cqw; }
.industry-effects b { font-weight: 500; color: var(--risk); margin-left: .5cqw; }

/* 03 + 05 — a document becomes inspectable, structured conditions. */
.extraction-art { gap: 3cqw; }
.event-fields { margin: 0; width: 27cqw; }
.event-field { display: flex; align-items: center; justify-content: space-between; gap: 1cqw; padding: .53cqw 0; border-bottom: 1px solid rgb(127 169 154 / .14); font-size: 1.05cqw; }
.event-field dt { color: var(--muted); font-size: .9cqw; }
.event-field dd { margin: 0; display: flex; gap: .8cqw; align-items: center; }
.risk-value { color: var(--risk); }
.event-field:last-child { border-bottom: 0; }
.extraction-art .micro-label { position: absolute; bottom: -1cqw; right: 5.7cqw; }
.policy-art { gap: 2.4cqw; }
.policy-note { width: 23cqw; }
.policy-note p { font-size: 1.25cqw; line-height: 1.85; }
.policy-note .paper-heading { color: var(--background); }
.compiler { flex: none; display: flex; width: 12cqw; flex-direction: column; align-items: center; gap: .7cqw; }
.compiler-name { color: var(--mint); font-size: .9cqw; white-space: nowrap; }
.compiler .connector { width: 10cqw; }
.constraints { width: 27cqw; }
.constraint { display: grid; grid-template-columns: 1fr auto 1.6cqw; align-items: center; gap: .9cqw; padding: .75cqw 0; border-bottom: 1px solid rgb(127 169 154 / .15); font-size: 1cqw; }
.constraint-value { color: var(--mint); font-size: .95cqw; }
.constraint .check { animation: reveal 350ms var(--ease) calc(var(--delay) + 300ms) both; }
.rule-status { margin: 1.1cqw 0 0; color: var(--mint); font-size: .75cqw; letter-spacing: .03em; display: flex; gap: .5cqw; align-items: center; }
.rule-status .icon { width: 1.1cqw; height: 1.1cqw; }

/* 04 — a small forecasting engine and four outputs, no dashboard. */
.forecast-art { flex-direction: column; gap: 1.8cqw; margin-top: 1.5cqw; }
.forecast-inputs { display: flex; align-items: center; justify-content: center; gap: 2.9cqw; }
.input-token { display: flex; flex-direction: column; align-items: center; gap: .4cqw; min-width: 5cqw; font-size: .9cqw; color: var(--muted); }
.input-token .icon { width: 2.4cqw; height: 2.4cqw; color: var(--mint); }
.forecast-engine { position: relative; width: 8cqw; height: 3.5cqw; border: 1px solid rgb(185 223 196 / .5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .9cqw; color: var(--mint); }
.forecast-engine::before, .forecast-engine::after { content: ""; position: absolute; width: 1px; height: 1.9cqw; left: 50%; background: repeating-linear-gradient(to bottom, var(--muted) 0 2px, transparent 2px 5px); }
.forecast-engine::before { bottom: 100%; }
.forecast-engine::after { top: 100%; }
.forecast-feed { position: absolute; width: 28cqw; height: 1.8cqw; left: 50%; top: -1.8cqw; transform: translateX(-50%); border: 1px dashed rgb(127 169 154 / .4); border-top: 0; border-radius: 0 0 50% 50%; }
.forecast-outputs { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2cqw; text-align: center; }
.forecast-metric { margin: 0; }
.forecast-metric dt { color: var(--muted); font-size: .9cqw; margin-bottom: .7cqw; }
.forecast-metric dd { font-variant-numeric: tabular-nums; margin: 0; color: var(--mint); font-size: 2.9cqw; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.metric-unit { font-size: 1.05cqw; margin-left: .3cqw; color: var(--muted); }
.forecast-metric.loss dd { color: var(--cream); }

/* 06 — allocations shift, three alternatives remain for the human. */
.portfolio-art { flex-direction: column; gap: 1.1cqw; margin-top: 1.1cqw; }
.allocation { display: flex; align-items: center; gap: 2cqw; }
.allocation-pool { width: 12.3cqw; }
.allocation-pool .pool-label { font-size: .65cqw; }
.allocation-pool .pool-value { font-size: 1.8cqw; }
.allocation-pool .pool-unit { font-size: .65cqw; }
.allocation-visual { display: flex; flex-direction: column; gap: .7cqw; }
.allocation-caption { display: flex; align-items: center; justify-content: space-between; font-size: .75cqw; color: var(--muted); gap: 2cqw; }
.scenario-count { color: var(--gold); font-variant-numeric: tabular-nums; }
.allocation-bars { display: flex; gap: .4cqw; height: 4.5cqw; align-items: flex-end; width: 28cqw; }
.allocation-bar { flex: 1; height: var(--initial-height); background: var(--muted); border-radius: 2px 2px 0 0; opacity: .6; transition: height 1200ms var(--ease), background 900ms var(--ease); }
.allocation-bars.is-calculated .allocation-bar { height: var(--target-height); background: var(--mint); opacity: .85; }
.portfolio-options { display: flex; width: 60cqw; justify-content: center; gap: 3cqw; margin-top: .8cqw; }
.portfolio-option { width: 18cqw; padding: 1cqw 0; text-align: center; border-bottom: 1px solid rgb(127 169 154 / .25); transition: border-color 450ms var(--ease), color 450ms var(--ease); }
.portfolio-name { display: flex; justify-content: center; align-items: center; gap: .6cqw; font-size: 1.3cqw; font-weight: 600; }
.selection-mark { font-size: .85cqw; color: var(--mint); opacity: 0; }
.portfolio-option[aria-pressed="true"] { color: var(--mint); border-color: var(--mint); }
.portfolio-option[aria-pressed="true"] .selection-mark { opacity: 1; }
.portfolio-traits { display: flex; flex-direction: column; gap: .5cqw; margin-top: .9cqw; font-size: .9cqw; color: var(--muted); }
.human-choice { margin: .7cqw 0 0; font-size: .85cqw; color: var(--cream); }
.human-choice span { color: var(--muted); margin-right: .6cqw; }

/* 07 — identical pools, one shock, a comparable remaining capacity. */
.stress-scene { padding-top: 10.4%; }
.stress-scene .scene-title { font-size: 3.3cqw; }
.stress-art { display: flex; flex-direction: column; margin-top: 1cqw; gap: .8cqw; }
.shock-event { color: var(--risk); font-size: 1cqw; display: flex; align-items: center; gap: .7cqw; }
.risk-badge { width: 1.4cqw; height: 1.4cqw; border: 1px solid var(--risk); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .85cqw; }
.stress-pools { display: flex; gap: 8cqw; align-items: center; }
.stress-case { text-align: center; }
.stress-case-title { font-size: .95cqw; margin: 0 0 .4cqw; display: flex; align-items: center; gap: .5cqw; justify-content: center; }
.stress-case .pool { width: 18cqw; }
.stress-case .pool-label { font-size: .8cqw; }
.stress-case .pool-value { font-size: 2.5cqw; }
.stress-case .pool-unit { font-size: .75cqw; }
.stress-case.current .pool-value { color: var(--dark); }
.stress-case.current .pool { --mint: #f0ebd8; --cream: #ed8a5c; }
.stress-case.balanced .stress-case-title { color: var(--mint); }
.stress-scenarios { display: flex; gap: .6cqw; }
.stress-button { font-size: .8cqw; padding: .65cqw 1.05cqw; border: 1px solid rgb(127 169 154 / .3); border-radius: 20px; color: var(--muted); transition: background 300ms, color 300ms, border-color 300ms; }
.stress-button[aria-pressed="true"] { color: var(--cream); border-color: var(--gold); }
.stress-principle { text-align: center; margin-top: .4cqw; font-size: 1cqw; line-height: 1.3; }
.stress-principle strong { color: var(--cream); font-size: 1cqw; font-weight: 600; }
.stress-principle p { margin: .55cqw 0 0; color: var(--muted); font-size: .72cqw; line-height: 1.6; }
.stress-principle p span { margin: 0 .6cqw; opacity: .4; }

/* 08 — from measurement to policy design. */
.closing-scene { justify-content: center; padding: 9% 6%; }
.legacy-label { position: absolute; top: 21%; left: 0; right: 0; text-align: center; font-size: 1cqw; line-height: 1.7; color: var(--muted); animation: legacy-out 900ms var(--ease) 1100ms both; }
.legacy-label span { display: block; font-size: .8cqw; }
.closing-title { font-size: 3.6cqw; margin: 0; line-height: 1.4; }
.closing-brand { display: flex; align-items: center; justify-content: center; gap: .9cqw; margin: 2.8cqw 0 .7cqw; font-size: 2.7cqw; font-weight: 600; letter-spacing: -.02em; }
.closing-brand .icon { width: 3cqw; height: 3cqw; color: var(--mint); }
.closing-tagline { margin: 0; color: var(--muted); font-size: .9cqw; letter-spacing: .07em; }
.engine-flow { display: flex; gap: 1.1cqw; align-items: center; justify-content: center; margin-top: 3cqw; color: var(--muted); font-size: .72cqw; letter-spacing: .14em; }
.engine-flow .icon { width: 1cqw; height: 1cqw; }
.closing-choice { font-size: 1cqw; color: var(--cream); margin-top: 2cqw; }
.closing-replay { font-size: .8cqw; color: var(--mint); padding: .7cqw 1cqw; letter-spacing: .13em; }

/* The first three chapters use a continuous SVG story timeline. Coordinates,
   shape changes and word extraction are driven by app.js, including mobile. */
.story-art { margin-top: 1.4cqw; }
.story-svg { display: block; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.story-svg text { font-family: inherit; }
.story-path { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 6; opacity: .45; }
.story-path-risk { stroke: var(--risk); }
.story-path-return { stroke: var(--mint); opacity: 0; }
.store-roof { fill: var(--mint); stroke: var(--mint); stroke-width: 2; }
.store-body { fill: var(--background); stroke: var(--mint); stroke-width: 2; }
.store-detail { fill: none; stroke: var(--mint); stroke-width: 1.7; stroke-linecap: round; }
.store-window { fill: var(--mint); }
.store-ground { fill: none; stroke: var(--muted); stroke-width: 1; }
.story-store { opacity: 0; }
.story-pool-label { fill: var(--dark); font-size: 16px; text-anchor: middle; }
.story-pool-value { fill: var(--dark); font-size: 44px; font-weight: 700; text-anchor: middle; font-variant-numeric: tabular-nums; }
.story-pool-unit { fill: var(--dark); font-size: 12px; text-anchor: middle; }
.reserve-unit { fill: var(--dark); opacity: .22; }
.story-shield { fill: var(--background); stroke: var(--mint); stroke-width: 2; }
.story-shield-check { fill: none; stroke: var(--mint); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.loss-unit { fill: var(--risk); }
.resource-token { fill: var(--gold); stroke: var(--background); stroke-width: 1.5; opacity: 0; }
.loss-token { fill: var(--risk); opacity: 0; }
.return-token { fill: var(--mint); opacity: 0; }
.story-goal { fill: var(--cream); font-size: 19px; font-weight: 500; text-anchor: middle; }
.story-mint { fill: var(--mint); }
.story-orange { fill: var(--risk); }
.story-caption { fill: var(--muted); font-size: 13px; text-anchor: middle; letter-spacing: .03em; }
.minor-region { fill: var(--muted); opacity: .28; }

function schedule(callback, delay) {
  if (state.reducedMotion) { callback(); return; }
  const version = state.version;
  const timer = window.setTimeout(() => {
    sceneTimers.delete(timer);
    if (version === state.version) callback();
  }, delay);
  sceneTimers.add(timer);
}

function clearSceneWork() {
  storyMotion = null;
  sceneTimers.forEach(timer => clearTimeout(timer));
  sceneTimers.clear();
  numberAnimations.forEach(animation => cancelAnimationFrame(animation.frame));
  numberAnimations.clear();
}

function animateNumber(id, target, options = {}) {
  const element = document.getElementById(id);
  if (!element) return;
  const previous = numberAnimations.get(id);
  if (previous) cancelAnimationFrame(previous.frame);
  const from = Number(element.dataset.value || 0);
  const { decimals = 0, prefix = "", duration = 1500 } = options;
  const start = performance.now();
  const version = state.version;
  const animation = { frame: 0 };
  const format = value => prefix + (decimals ? value.toFixed(decimals) : formatter.format(Math.round(value)));
  const finish = value => { element.dataset.value = String(value); element.textContent = format(value); };
  if (state.reducedMotion) { finish(target); return; }
  function frame(now) {
    if (version !== state.version || !element.isConnected) { numberAnimations.delete(id); return; }
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    finish(from + (target - from) * eased);
    if (t < 1) animation.frame = requestAnimationFrame(frame);
    else { finish(target); numberAnimations.delete(id); }
  }
  numberAnimations.set(id, animation);
  animation.frame = requestAnimationFrame(frame);
}

// Continuous motion explains the idea: funds actually travel, regional signals
// follow a curve, and words leave a document and become typed risk variables.
// This timeline is independent of automatic scene navigation. Manual navigation
// stops autoplay but allows the selected scene's explanation to finish.
function unit(value) { return Math.max(0, Math.min(1, value)); }
function progress(time, start, end) {
  const p = unit((time - start) / (end - start));
  return p * p * (3 - 2 * p);
}
function mix(from, to, p) { return from + (to - from) * p; }
function opacity(element, value) { if (element) element.style.opacity = String(unit(value)); }
function pathSampler(path) {
  const length = path.getTotalLength();
  return p => path.getPointAtLength(length * unit(p));
}
function placeToken(token, point, visibility) {
  token.setAttribute("cx", point.x);
  token.setAttribute("cy", point.y);
  opacity(token, visibility);
}
function tokenVisibility(p) { return progress(p, 0, .14) * (1 - progress(p, .82, 1)); }
function caption(root, text) {
  const element = root.querySelector("[data-motion-caption]");
  if (element.textContent !== text) element.textContent = text;
}

function createDilemmaMotion(root) {

  const stores = [...root.querySelectorAll("[data-store]")];
  const resources = [...root.querySelectorAll("[data-resource-token]")];
  const losses = [...root.querySelectorAll("[data-loss-token]")];

  const lossUnits = [...root.querySelectorAll("[data-loss-unit]")];
  const pool = root.querySelector("[data-pool-graphic]");
  const shield = root.querySelector("[data-protection-shield]");
  const shieldCheck = root.querySelector(".story-shield-check");
  const returnToken = root.querySelector("[data-return-token]");
  const returnLine = root.querySelector("[data-return-path]");
  const capacity = root.querySelector("#capacity");
  shieldCheck.style.strokeDasharray = "60";
  return elapsed => {
    const t = elapsed / 1000;
    const support = progress(t, 2.4, 6);
    const protection = progress(t, 4.3, 6.2);
    opacity(pool, progress(t, .6, 1.5));
    stores.forEach((store, i) => {
      const grown = progress(t, i ? 2.1 + i * 1.3 : .85, i ? 3 + i * 1.3 : 1.65);
      opacity(store, grown);
      store.setAttribute("transform", `translate(24 73) scale(${mix(.86, 1, grown)} ${mix(.12, 1, grown)}) translate(-24 -73)`);
    });
    resources.forEach((token, i) => {
      const p = unit((t - (2.2 + i * .8)) / 1.45);
      placeToken(token, supportPath(progress(p, 0, 1)), tokenVisibility(p));
    });
    losses.forEach((token, i) => {
      const p = unit((t - (2.15 + i * 2.35)) / 1.65);
      placeToken(token, lossPath(progress(p, 0, 1) * (i ? .67 : 1)), tokenVisibility(p));
    });
    const returning = unit((t - 6.15) / 1.65);
    placeToken(returnToken, returnPath(progress(returning, 0, 1)), tokenVisibility(returning));
    opacity(returnLine, progress(t, 5.7, 6.3) * .6);
    opacity(shield, mix(.28, 1, protection));
    shield.setAttribute("transform", `scale(1 ${mix(.62, 1, protection)})`);
    shieldCheck.style.strokeDashoffset = String(60 * (1 - protection));
    const shrinking = progress(t, 5.1, 8);
    lossUnits.forEach((bar, i) => {
      bar.setAttribute("width", mix(35 - i * 5, i ? 0 : 10, shrinking));
      opacity(bar, i ? 1 - shrinking : 1);
    });
    reserve.forEach((bar, i) => opacity(bar, i > 5 ? mix(.22, .035, support) : .22));
    const value = Math.round(mix(DEMO_DATA.availableGuarantee, DEMO_DATA.constrainedGuarantee, support));
    capacity.textContent = formatter.format(value);
    capacity.dataset.value = String(value);
    root.dataset.supportLevel = String(1 + Number(t >= 4.3) + Number(t >= 5.6));
    root.dataset.lossLevel = String(3 - Number(t >= 6.5) - Number(t >= 8));
    root.dataset.motionPhase = t < 2.2 ? "resource" : t < 4.5 ? "support" : t < 8 ? "protect" : "balanced";
    caption(root, t < 2.2 ? "한정된 재원, 두 가지 목표" : t < 4.5 ? "재원이 이동하고, 지역 지원이 늘어납니다." : t < 8 ? "손실 흐름을 막고, 여력을 지킵니다." : "지원은 늘리고, 손실은 줄이고.");
  };
}

function createSignalMotion(root) {
  const line = root.querySelector("[data-region-path]");
  const sample = pathSampler(line);
  const length = line.getTotalLength();
  const regions = [...root.querySelectorAll("[data-region]")];
  const packet = root.querySelector("[data-flow-packet]");
  const tail = root.querySelector("[data-flow-tail]");
  const news = root.querySelector("[data-regional-news]");
  const newsToken = root.querySelector("[data-news-signal]");
  const newsSample = pathSampler(root.querySelector("[data-news-route]"));
  const industries = [...root.querySelectorAll("[data-industry]")].map(group => ({ group, token: group.querySelector("[data-industry-token]"), sample: pathSampler(group.querySelector("[data-industry-path]")) }));
  const fractions = [0, .237, .5, .763, 1];
  const names = ["서울", "경기", "전북", "충남", "부산"];
  line.style.strokeDasharray = String(length);
  return elapsed => {
    const t = elapsed / 1000;
    const leg = Math.max(0, Math.min(3, Math.floor((t - 1.2) / 1.4)));
    const withinLeg = progress(t, 1.2 + leg * 1.4, 2.6 + leg * 1.4);
    const p = mix(fractions[leg], fractions[leg + 1], withinLeg);
    line.style.strokeDashoffset = String(length * (1 - p));
    opacity(line, progress(t, .7, 1.25) * .75);
    placeToken(packet, sample(p), progress(t, 1, 1.3) * (1 - progress(t, 7.2, 7.6)));
    placeToken(tail, sample(Math.max(0, p - .025)), progress(t, 1.2, 1.5) * (1 - progress(t, 7.1, 7.6)) * .7);
    regions.forEach((region, i) => {
      const arrived = progress(t, 1.2 + i * 1.4 - .2, 1.2 + i * 1.4 + .35);
      const focus = Math.sin(Math.PI * unit((t - (1.2 + i * 1.4)) / .9));
      opacity(region, mix(.35, 1, arrived));
      region.querySelector(".flow-region-dot").setAttribute("r", 8 + focus * 3);
      const ring = region.querySelector(".flow-region-ring");
      ring.setAttribute("r", 18 + focus * 5);
      opacity(ring, mix(.18, .6, arrived));
    });
    const risk = progress(t, 4.2, 5.3);
    regions[2].querySelector(".flow-region-dot").style.fill = risk > .5 ? "var(--risk)" : "var(--muted)";
    regions[2].querySelector(".flow-region-ring").style.stroke = risk > .5 ? "var(--risk)" : "var(--mint)";
    opacity(regions[2].querySelector(".flow-risk-mark"), risk);
    opacity(news, progress(t, 3.25, 4.15));
    const newsP = unit((t - 4.1) / 1.2);
    placeToken(newsToken, newsSample(newsP), tokenVisibility(newsP));
    industries.forEach((item, i) => {
      opacity(item.group, progress(t, 5.1 + i * .25, 6 + i * .25));
      const branchP = unit((t - 5.3 - i * .35) / 1.6);
      placeToken(item.token, item.sample(progress(branchP, 0, 1)), tokenVisibility(branchP));
    });
    const visited = Math.max(0, Math.min(4, Math.floor((t - 1.2) / 1.4)));
    root.dataset.signalStop = names[visited];
    root.dataset.motionPhase = t < 4.2 ? "regional-flow" : t < 7.3 ? "risk-detected" : "structured-signal";
    caption(root, t < 4.2 ? "서울 → 경기 → 전북 → 충남 → 부산 · 순차 탐색" : t < 7.3 ? "전북의 신호를 발견하고, 업종별 영향을 연결합니다." : "17개 지역 신호 탐색 · 위치와 흐름은 개념도");
  };
}

function createExtractionMotion(root) {
  const documentGraphic = root.querySelector("[data-extraction-document]");
  const copy = root.querySelector("[data-news-copy]");
  const scan = root.querySelector("[data-news-scan]");
  const scanEdge = root.querySelector("[data-news-scan-edge]");
  const gate = root.querySelector("[data-extraction-gate]");
  const rows = [...root.querySelectorAll("[data-risk-row]")];
  const check = root.querySelector("[data-extraction-check]");
  const seal = root.querySelector("[data-event-seal]");
  const highlightGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
  documentGraphic.insertBefore(highlightGroup, copy);
  const words = [...root.querySelectorAll("[data-extracted-word]")].map(token => {
    const row = Number(token.dataset.row);
    const sourceWord = root.querySelector(`[data-keyword="${token.dataset.extractedWord}"]`);
    const sourceBox = sourceWord.getBBox();
    const destination = rows[row].querySelector("[data-risk-value]");
    const destinationBox = destination.getBBox();
    const highlight = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    for (const [name, value] of Object.entries({ x: sourceBox.x - 4, y: sourceBox.y - 2, width: sourceBox.width + 8, height: sourceBox.height + 4, rx: 3, fill: "var(--mint)" })) highlight.setAttribute(name, value);
    highlightGroup.appendChild(highlight);
    return { token, row, sourceWord, destination, highlight, from: { x: sourceBox.x + sourceBox.width / 2 + 70, y: sourceBox.y + sourceBox.height / 2 + 21 }, to: { x: destinationBox.x + destinationBox.width / 2 + 577, y: destinationBox.y + destinationBox.height / 2 + 55 + row * 30 } };
  });
  check.style.strokeDasharray = "45";
  return elapsed => {
    const t = elapsed / 1000;
    const unfolded = progress(t, 1.1, 2.2);
    const morphed = progress(t, 6.8, 8.4);
    const x = mix(mix(280, 70, unfolded), 172, morphed);
    documentGraphic.setAttribute("transform", `translate(${x} ${mix(21, 85, morphed)}) scale(${mix(1, .42, morphed)})`);
    opacity(documentGraphic, progress(t, .5, 1.1) * (1 - morphed));
    const scanY = mix(49, 189, progress(t, 1.7, 3.5));
    scan.setAttribute("y", scanY);
    scanEdge.setAttribute("d", `M13 ${scanY}h314`);
    const scanVisible = progress(t, 1.6, 1.9) * (1 - progress(t, 3.5, 3.9));
    opacity(scan, scanVisible * .45);
    opacity(scanEdge, scanVisible);
    opacity(gate, progress(t, 2.1, 2.8) * (1 - progress(t, 7, 8.1)));
    opacity(root.querySelector("[data-extraction-path]"), progress(t, 2, 2.8) * .45);
    rows.forEach((row, i) => opacity(row, progress(t, 2.1 + i * .08, 2.7 + i * .08)));
    let extracted = 0;
    words.forEach((word, i) => {
      const start = 2.6 + i * .6;
      const p = unit((t - start) / 1.55);
      const eased = progress(p, 0, 1);
      const q = 1 - eased;
      // Cubic travel curves converge at the extraction gate before separating
      // into each destination field. This is the actual text-to-variable action.
      const wordX = q ** 3 * word.from.x + 3 * q ** 2 * eased * 430 + 3 * q * eased ** 2 * 520 + eased ** 3 * word.to.x;
      const wordY = q ** 3 * word.from.y + 3 * q ** 2 * eased * 145 + 3 * q * eased ** 2 * 129 + eased ** 3 * word.to.y;
      word.token.setAttribute("transform", `translate(${wordX} ${wordY}) scale(${mix(1, .94, eased)})`);
      opacity(word.token, tokenVisibility(p));
      opacity(word.sourceWord, 1 - .88 * progress(t, start, start + .3));
      opacity(word.highlight, progress(t, start - .35, start) * .75);
      opacity(word.destination, progress(t, start + 1.2, start + 1.55));
      if (p === 1) extracted++;
    });
    opacity(rows[5].querySelector("[data-risk-value]"), progress(t, 6.6, 7.3));
    opacity(rows[6].querySelector("[data-risk-value]"), progress(t, 7, 7.7));
    const verified = progress(t, 7.3, 8.1);
    opacity(check, verified);
    check.style.strokeDashoffset = String(45 * (1 - verified));
    opacity(seal, progress(t, 7.5, 8.6));
    seal.setAttribute("transform", `translate(244 133) scale(${mix(.7, 1, progress(t, 7.5, 8.6))})`);
    root.dataset.extractedCount = String(extracted);
    root.dataset.motionPhase = t < 1.7 ? "news" : t < 3.5 ? "scan" : t < 6.6 ? "extract" : t < 8.4 ? "compile" : "risk-event";
    caption(root, t < 1.7 ? "한 장의 뉴스에서 출발합니다." : t < 3.5 ? "문장 속 지역 · 사건 · 기간을 읽습니다." : t < 6.6 ? "핵심 정보가 분리되어 변수로 이동합니다." : t < 8.4 ? "영향과 신뢰도를 연결하고 위험 변수로 변환합니다." : "뉴스 → 구조화된 Risk Event · DEMO SIMULATION");
  };
}

function startSceneEffects() {
  if (state.index < 3) {
    const root = elements.host.querySelector(".scene:not(.is-leaving)");
    const createMotion = [createDilemmaMotion, createSignalMotion, createExtractionMotion][state.index];
    storyMotion = { elapsed: 0, update: createMotion(root) };
    storyMotion.update(state.reducedMotion ? 10000 : 0);
  }
  if (state.index === 3) {
    schedule(() => animateNumber("forecast-demand", DEMO_DATA.forecastDemandGrowth, { decimals: 1, prefix: "+" }), 2150);
    schedule(() => animateNumber("forecast-pd", DEMO_DATA.pd, { decimals: 1 }), 2400);
    schedule(() => animateNumber("forecast-loss", DEMO_DATA.expectedLoss), 2650);
    schedule(() => animateNumber("forecast-recovery", DEMO_DATA.recoveryRate), 2900);
  }
  if (state.index === 5) {
    schedule(() => animateNumber("scenario-count", DEMO_DATA.scenarios, { duration: 1700 }), 950);
    schedule(() => document.getElementById("allocation-bars")?.classList.add("is-calculated"), 2350);
  }
  if (state.index === 6) schedule(updateStressNumbers, 1850);
}

function showScene(index, { announce = true } = {}) {
  if (index < 0 || index >= SCENES.length) return;
  clearSceneWork();
  state.version += 1;
  state.index = index;
  state.elapsed = 0;
  state.lastTick = performance.now();
  const scene = SCENES[index];
  const oldScene = elements.host.querySelector(".scene:not(.is-leaving)");
  const moveFocus = oldScene?.contains(document.activeElement);
  elements.host.querySelectorAll(".is-leaving").forEach(node => node.remove());
  // An outgoing frame stays visible only for the crossfade. Remove it from the
  // accessibility tree and keyboard order; duplicate numeric IDs are removed too.
  if (oldScene) {
    oldScene.classList.remove("is-entering");
    oldScene.classList.add("is-leaving");
    oldScene.inert = true;
    oldScene.setAttribute("aria-hidden", "true");
    oldScene.querySelectorAll("[id]").forEach(node => node.removeAttribute("id"));
    window.setTimeout(() => oldScene.remove(), state.reducedMotion ? 0 : 800);
  }
  const nextScene = document.createElement("article");
  nextScene.className = `scene is-entering${index === 6 ? " stress-scene" : ""}${index === 7 ? " closing-scene" : ""}`;
  nextScene.setAttribute("aria-label", `${index + 1}번째 장면: ${scene.chapter}`);
  nextScene.innerHTML = scene.render(scene);
  elements.host.appendChild(nextScene);
  elements.chapter.textContent = scene.chapter;
  elements.number.innerHTML = `${String(index + 1).padStart(2, "0")} <span class="total">/ ${String(SCENES.length).padStart(2, "0")}</span>`;
  elements.subtitle.textContent = scene.subtitle;
  elements.prev.disabled = index === 0;
  elements.next.disabled = index === SCENES.length - 1;
  if (announce) elements.announcement.textContent = `${index + 1} / ${SCENES.length}. ${scene.chapter}. ${scene.title.join(" ")}`;
  [...elements.timeline.children].forEach((button, i) => {
    button.classList.toggle("is-complete", i < index);
    if (i === index) button.setAttribute("aria-current", "step");
    else button.removeAttribute("aria-current");
    button.querySelector(".timeline-fill").style.transform = i < index ? "scaleX(1)" : "scaleX(0)";
  });
  startSceneEffects();
  updatePlaybackUI();
  updateTranscript();
  if (moveFocus) elements.timeline.children[index].focus({ preventScroll: true });
}

  const stress = DEMO_DATA.stress[state.stress];
  const content = [
    ["같은 재원, 서로 다른 목표", [`지역 지원 확대와 건전성 관리를 함께 고려합니다.`, `가용 재보증 ${formatter.format(DEMO_DATA.availableGuarantee)} → ${formatter.format(DEMO_DATA.constrainedGuarantee)}억원 (가상 예시)`]],
    ["지역의 변화에서 위험 신호를 발견", ["서울 → 경기 → 전북 → 충남 → 부산의 지역 신호를 순차 탐색합니다.", `가상 뉴스: ${DEMO_DATA.news.region} 주요 제조사업장 ${DEMO_DATA.news.months}개월 생산중단`, "전북의 제조업과 운송·음식·숙박업에 영향이 퍼집니다. 위치와 탐색 경로는 개념도입니다."]],
    ["뉴스를 구조화된 Risk Event로 변환", ["기사 속 단어를 읽고, 분리하고, 각각의 위험 변수로 옮깁니다.", `${DEMO_DATA.news.region} · ${DEMO_DATA.news.event} · ${DEMO_DATA.news.months}개월`, "직접 영향: 제조업 / 2차 영향: 운송·음식·숙박", `추출 신뢰도 ${DEMO_DATA.news.confidence}% (가상 예시)`]],
    ["Forecast Engine의 가상 예측", [`3개월 보증수요 +${DEMO_DATA.forecastDemandGrowth}% / 예상 PD ${DEMO_DATA.pd}%`, `예상손실 ${DEMO_DATA.expectedLoss}억원 / 예상 회수율 ${DEMO_DATA.recoveryRate}%`]],
    ["정책 언어를 계산 가능한 조건으로", ["비수도권 지원 ≥ 정책 목표", "예상손실 ≤ 기준안 / 건설업 Exposure ≤ 집중 한도", "중저신용 지원 ≥ 기존 수준 / 총 재보증 ≤ 가용 여력"]],
    ["세 가지 대안을 담당자가 선택", [`${formatter.format(DEMO_DATA.scenarios)}개 가상 시나리오 · ${formatter.format(DEMO_DATA.availableGuarantee)}억원 여력`, "안정형: 손실·지원 ↓ / 균형형: 손실·지원 ↔", `지원확대형: 지원·위험 ↑ / 현재 선택: ${PORTFOLIOS[state.portfolio].name}`]],
    ["충격 이후의 가상 가용 여력 비교", [`${stress.event} · 현재 계획 ${formatter.format(stress.current)}억원`, `${PORTFOLIOS[state.portfolio].comparison} ${formatter.format(stress[state.portfolio])}억원`, "구조적 악화는 한도 조정 검토, 일시적 충격은 지원 유지·확대 가능"]],
    ["위험 측정에서 정책금융 설계로", ["SIGNAL → FORECAST → POLICY → OPTIMIZE → STRESS", "최종 의사결정은 사람에게."]],
  ][state.index];
  const host = document.getElementById("transcript-content");
  host.replaceChildren();
  const heading = document.createElement("p");
  heading.textContent = content[0];
  const list = document.createElement("ul");
  content[1].forEach(line => { const item = document.createElement("li"); item.textContent = line; list.appendChild(item); });
  host.append(heading, list);
}

function updatePlaybackUI() {
  elements.toggle.setAttribute("aria-pressed", String(state.autoplay));
  elements.toggle.setAttribute("aria-label", state.autoplay ? "자동재생 일시정지" : "자동재생 시작");
  elements.playIcon.textContent = state.autoplay ? "Ⅱ" : "▷";
  elements.playLabel.textContent = state.autoplay ? "자동재생" : "재생";
}

function pause() { state.autoplay = false; updatePlaybackUI(); }

function navigate(index) { pause(); showScene(index); }

function replay() {
  state.portfolio = "balanced";
  state.stress = "construction";
  state.autoplay = !state.reducedMotion;
  showScene(0);
}

function selectPortfolio(key) {
  if (!PORTFOLIOS[key]) return;
  pause();
  state.portfolio = key;
  elements.host.querySelectorAll("[data-portfolio]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.portfolio === key)));
  const bars = document.getElementById("allocation-bars");
  bars?.classList.add("is-calculated");
  bars?.querySelectorAll(".allocation-bar").forEach((bar, i) => bar.style.setProperty("--target-height", `${DEMO_DATA.allocations[key][i]}%`));
  elements.announcement.textContent = `${PORTFOLIOS[key].name} 선택. 다음 장면에서 이 대안의 가상 스트레스 결과를 비교합니다. 최종 선택은 담당자입니다.`;
  updateTranscript();
}

function updateStressNumbers() {
  const stress = DEMO_DATA.stress[state.stress];
  animateNumber("stress-current", stress.current, { duration: 1400 });
  animateNumber("stress-proposal", stress[state.portfolio], { duration: 1400 });
}

function selectStress(key) {
  if (!DEMO_DATA.stress[key]) return;
  pause();
  // Cancel the scene's initial shock so it cannot supersede a manual selection.
  sceneTimers.forEach(timer => clearTimeout(timer));
  sceneTimers.clear();
  state.stress = key;
  document.getElementById("shock-event").textContent = DEMO_DATA.stress[key].event;
  elements.host.querySelectorAll("[data-stress]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.stress === key)));
  updateStressNumbers();
  const stress = DEMO_DATA.stress[key];
  elements.announcement.textContent = `가상 시뮬레이션. ${stress.event}. 현재 계획 가용 여력 ${formatter.format(stress.current)}억원, ${PORTFOLIOS[state.portfolio].comparison} ${formatter.format(stress[state.portfolio])}억원.`;
  updateTranscript();
}

SCENES.forEach((scene, index) => {
  const button = document.createElement("button");
  button.className = "timeline-button";
  button.setAttribute("aria-label", `${index + 1}번째 장면: ${scene.chapter}`);
  button.innerHTML = '<span class="timeline-track"><span class="timeline-fill"></span></span>';
  button.addEventListener("click", () => navigate(index));
  elements.timeline.appendChild(button);
});

elements.prev.addEventListener("click", () => navigate(state.index - 1));
elements.next.addEventListener("click", () => navigate(state.index + 1));
elements.toggle.addEventListener("click", () => {
  if (state.autoplay) pause();
  else if (state.index === SCENES.length - 1 && state.elapsed >= SCENES[state.index].duration) {
    state.autoplay = true;
    showScene(0);
  } else { state.autoplay = true; state.lastTick = performance.now(); updatePlaybackUI(); }
});
document.getElementById("replay").addEventListener("click", replay);
document.getElementById("brand-replay").addEventListener("click", event => { event.preventDefault(); replay(); });
document.getElementById("mobile-transcript").addEventListener("click", event => { if (event.target.closest("summary")) pause(); });

elements.stage.addEventListener("click", event => {
  const target = event.target.closest("button, a");
  if (target?.dataset.portfolio) selectPortfolio(target.dataset.portfolio);
  else if (target?.dataset.stress) selectStress(target.dataset.stress);
  else if (target?.hasAttribute("data-replay")) {
    // The in-scene replay disappears on navigation; move focus to a stable button.
    document.getElementById("replay").focus({ preventScroll: true });
    replay();
  } else if (!target) {
    const bounds = elements.stage.getBoundingClientRect();
    navigate(state.index + (event.clientX - bounds.left < bounds.width / 2 ? -1 : 1));
  }
});

document.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
  if (event.key === "Tab") { pause(); return; }
  if (event.target.closest("input, textarea, select, [contenteditable='true']")) return;
  // Space on a focused control keeps its native activation behavior.
  if (event.code === "Space" && event.target.closest("button, a, summary")) return;
  if (event.code === "Space" || event.key === "ArrowRight") { event.preventDefault(); navigate(state.index + 1); }
  else if (event.key === "ArrowLeft") { event.preventDefault(); navigate(state.index - 1); }
});

document.addEventListener("visibilitychange", () => {
  // Hidden tabs do not silently consume a presentation; returning resumes the
  // remaining scene time if the viewer had not paused manually.
  state.lastTick = performance.now();
});

motionQuery.addEventListener("change", event => {
  state.reducedMotion = event.matches;
  if (event.matches) pause();
  // Re-render to settle pending numeric effects without motion.
  showScene(state.index, { announce: false });
});

function tick(now) {
  const delta = Math.max(0, now - state.lastTick);
  state.lastTick = now;
  if (storyMotion && !document.hidden && !state.reducedMotion) {
    storyMotion.elapsed = Math.min(storyMotion.elapsed + delta, 10000);
    storyMotion.update(storyMotion.elapsed);
  }
  if (state.autoplay && !document.hidden) {
    state.elapsed += delta;
    if (state.elapsed >= SCENES[state.index].duration) {
      if (state.index < SCENES.length - 1) showScene(state.index + 1);
      else { state.elapsed = SCENES[state.index].duration; pause(); }
    }
  }
  const fill = elements.timeline.children[state.index]?.querySelector(".timeline-fill");
  if (fill) fill.style.transform = `scaleX(${Math.min(state.elapsed / SCENES[state.index].duration, 1)})`;
  requestAnimationFrame(tick);
}

showScene(0);
requestAnimationFrame(tick);
    </script>
    <!-- REBALANCE:SCRIPT:END -->
  </body>
</html>
