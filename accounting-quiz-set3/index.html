<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>중급회계 3회 실전 모의고사 · 예제 심화형</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182336;--muted:#65738a;--edge:#dfe5ee;--blue:#355dde;--bluebg:#eef2ff;--green:#067647;--greenbg:#e8f9ee;--red:#b42318;--redbg:#fff0ef;--gold:#975a12;--goldbg:#fff6e6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;line-height:1.65}.wrap{max-width:980px;margin:auto;padding:16px 13px 90px}.hero,.card{background:var(--card);border:1px solid var(--edge);border-radius:18px}.hero{padding:24px}.hero h1{font-size:26px;margin:0 0 8px;line-height:1.35}.sub,.tiny{color:var(--muted)}.sub{margin:0;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 0}.chip{background:var(--bluebg);border-radius:999px;font-size:13px;color:var(--blue);padding:5px 10px;font-weight:750}.sticky{position:sticky;top:0;z-index:30;padding:10px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}.progressbox{display:flex;gap:12px;align-items:center;border:1px solid var(--edge);border-radius:12px;padding:11px 14px;background:var(--card)}.timer{font-weight:900;font-variant-numeric:tabular-nums;min-width:62px}.track{height:8px;border-radius:99px;background:#e5eaf3;flex:1;overflow:hidden}.fill{height:100%;background:var(--blue);width:0}.answered{font-size:13px;white-space:nowrap;color:var(--muted)}.jump{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:6px;padding:8px 0 12px}.jump a{font-size:12px;text-align:center;text-decoration:none;color:var(--muted);background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:5px}.jump a.done{background:var(--bluebg);color:var(--blue);border-color:#aabcf9}.question{padding:19px;margin:12px 0}.qtitle{display:flex;align-items:center;justify-content:space-between;gap:8px}.qnum{font-weight:900;color:var(--blue)}.kind{border-radius:99px;padding:2px 8px;background:#eff2f7;color:#526179;font-size:12px}.stem{font-size:17px;font-weight:740;white-space:pre-line;margin:14px 0}.option{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--edge);border-radius:12px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:var(--bluebg)}.option input{margin-top:5px;accent-color:var(--blue)}.no{font-weight:900;min-width:20px}.extras{border-top:1px dashed var(--edge);margin-top:14px;padding-top:13px}.extras details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:750}.extras p{font-size:12px;color:var(--muted);margin:7px 0}.doubts{display:flex;gap:7px;flex-wrap:wrap}.doubts label{border:1px solid var(--edge);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}.doubts label:has(input:checked){background:var(--goldbg);border-color:#f9b650;color:var(--gold)}textarea{display:block;width:100%;border:1px solid var(--edge);border-radius:10px;background:var(--card);color:var(--ink);padding:10px;resize:vertical;font-family:inherit;margin-top:9px;min-height:55px}.actions{padding:23px;text-align:center;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--edge)}.hidden{display:none!important}#result{display:none}.resultcard,.reviewcard{padding:22px;margin-top:13px}.score{font-size:52px;line-height:1.2;font-weight:950}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.metric{border:1px solid var(--edge);border-radius:12px;padding:12px}.mtop{display:flex;justify-content:space-between;font-weight:800;font-size:14px}.bar{height:8px;background:#e6eaf2;border-radius:99px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--blue)}.vital{border-left:4px solid #dc8a19;background:var(--goldbg);padding:12px;border-radius:10px;margin:9px 0}.rline{padding:13px 14px;border:1px solid var(--edge);border-radius:12px;margin:11px 0}.rline.wrong{background:var(--redbg);border-color:#f4b5b0}.rline.right{background:var(--greenbg);border-color:#abe0bd}.rtitle{font-weight:900}.details{font-size:14px}.source{font-size:12px;color:var(--muted);margin-top:6px}.rline b{font-weight:850}.topactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}#copyStatus{font-size:13px;color:var(--muted)}@media(max-width:650px){.hero h1{font-size:21px}.jump{grid-template-columns:repeat(9,minmax(0,1fr))}.metrics{grid-template-columns:1fr}.question{padding:15px}.stem{font-size:16px}.answered{display:none}}

</style></head><body><div class="wrap"><header class="hero"><h1>중급회계 실전 모의고사 3회 <span style="color:var(--blue)">예제 심화형</span></h1><p class="sub">교수님 PPT의 실제 예제(제4·5·6장)를 바탕으로 출제 형태를 재구성했습니다. 원본 예제 그대로가 아닌 수치·조건 변경 응용문제입니다.</p><div class="chips"><span class="chip">25문항 · 5지선다</span><span class="chip">난도 상</span><span class="chip">60분 권장</span><span class="chip">정답 제출 후 공개</span><span class="chip">선지별 헷갈림 메모</span></div></header><div class="sticky"><div class="progressbox"><span class="timer" id="timer">60:00</span><div class="track"><div class="fill" id="fill"></div></div><span id="answered" class="answered">0/25</span></div><nav id="jump" class="jump"></nav></div><main id="questions"></main><section class="card actions" id="submitSection"><button type="button" class="btn primary" id="submitBtn">25문항 제출 · 자동 채점</button><p class="sub" style="margin-top:8px">답안은 브라우저에 자동 저장되며 미응답 문항이 있어도 확인 후 제출할 수 있습니다.</p></section><section id="result"><div class="card resultcard"><h2>시험 결과</h2><div class="score"><span id="points">0</span><small style="font-size:20px"> / 100</small></div><p class="sub" id="overall"></p><div class="metrics" id="metrics"></div><div class="topactions"><button class="btn secondary" type="button" id="toggleFocus">오답·헷갈린 선지만 보기</button><button class="btn secondary" type="button" id="copyReport">진단 결과 복사하기</button><button class="btn secondary" type="button" id="reset">새로 풀기</button><span id="copyStatus"></span></div></div><div class="card reviewcard"><h2>우선 복습 개념</h2><div id="weak"></div></div><div class="card reviewcard"><h2>문항·선지별 상세 해설</h2><div id="reviews"></div></div></section></div><script>
const QS=[{"id": 1, "area": "회계환경·기준", "concept": "IFRS 적용방향", "stem": "국제회계기준의 성격을 설명한 다음 보기에서 교수자료와 일치하는 내용으로만 묶인 것은?\n\nㄱ. 특정 상황에 대한 전문가의 판단을 중시한다.\nㄴ. 적용의 유연성을 허용하므로 공시를 강화할 필요성이 있다.\nㄷ. 주요 산업에 대해서는 독립적인 세부 회계기준을 두는 것이 기본방향이다.\nㄹ. 연결재무제표를 중심으로 한다.\nㅁ. 구체적 실무적용지침을 중심으로 회계처리를 통일한다.", "options": ["ㄱ·ㄴ·ㄷ", "ㄱ·ㄷ·ㄹ", "ㄱ·ㄴ·ㄹ", "ㄴ·ㄹ·ㅁ", "ㄱ·ㄴ·ㄹ·ㅁ"], "answer": 2, "explain": "ㄱ·ㄴ·ㄹ은 교수자료의 특징이다. ㄷ(산업별 세부기준)과 ㅁ(구체적 실무지침 중심)은 원칙주의 방향과 맞지 않는다.", "source": "제1장 24쪽 「국제회계기준의 특징」", "kind": "개념"}, {"id": 2, "area": "회계환경·기준", "concept": "정보제공과 수탁책임", "stem": "경영자는 한 회계기간의 재무상태와 경영성과를 주주에게 보고하였다. 투자자는 이 자료를 참고해 투자수익률과 위험을 추정하고 A기업과 B기업 중 자본을 투입할 기업을 선택하였다. 이 거래에서 회계정보의 기능에 대한 설명으로 가장 부적절한 것은?", "options": ["경영자의 주주 대상 보고는 수탁책임을 이행하는 기능과 관련된다.", "기업 간 투자대상을 선정하는 행위는 정보제공기능과 관련된다.", "예상수익과 위험의 평가는 경제적 의사결정을 지원하는 기능이다.", "기업 경영성과의 전달과 투자자 판단은 서로 다른 기능에 각각 관련될 수 있다.", "투자자의 자본배분 판단은 경영자가 위임받은 사항을 보고한다는 의미의 수탁기능이 핵심이다."], "answer": 4, "explain": "수탁기능은 경영자가 위임받은 사항을 주주에게 보고하는 측면이다. 투자자의 수익·위험 평가와 효율적 자원배분은 정보제공기능이다.", "source": "제1장 7쪽 「재무보고의 기능 및 환경」", "kind": "개념"}, {"id": 3, "area": "회계환경·기준", "concept": "재무제표의 범위", "stem": "회사 홈페이지에 다음 정보가 공표되었다.\n① 연결재무상태표 ② 포괄손익계산서 ③ 현금흐름표 ④ 주석 ⑤ 사업보고서 ⑥ 경영자의 내년도 매출예측 ⑦ 자본변동표\n\n교수자료에서 '재무제표'의 구성요소에 해당하는 항목 수로 옳은 것은?", "options": ["3개", "5개", "4개", "6개", "7개"], "answer": 1, "explain": "재무제표는 재무상태표·포괄손익계산서·자본변동표·현금흐름표·주석, 총 5개다. 사업보고서와 경영자의 예측은 넓은 의미의 재무보고 수단이다.", "source": "제1장 6쪽 「재무보고와 재무제표」", "kind": "개념"}, {"id": 4, "area": "재무제표", "concept": "재무제표 작성 일반원칙", "stem": "K기업은 중요하지 않은 동일 성격의 항목을 통합 표시하고, 비교재무제표를 작성하였다. 또한 현금흐름표를 제외한 재무제표에 발생기준을 적용하였다. 다음 중 이러한 작성방식과 교수자료의 표시원칙에 대한 설명으로 적절하지 않은 것은?", "options": ["원칙적으로 자산과 부채의 상계를 허용하여 순액만 표시하는 것이 비교가능성을 높인다.", "중요하지 않은 항목의 통합표시는 중요성 원칙과 양립한다.", "적어도 1년에 한 번 전체 재무제표를 작성하는 것이 원칙이다.", "현금흐름표는 발생기준을 적용하는 다른 재무제표와 구분된다.", "표시와 분류의 계속성은 매기 동일하게 표시·분류한다는 취지다."], "answer": 0, "explain": "상계금지 원칙상 자산과 부채, 수익과 비용은 원칙적으로 상계하지 않는다. 나머지는 교수자료의 작성·표시 원칙과 일치한다.", "source": "제3장 5쪽 「재무제표 작성과 표시」", "kind": "개념"}, {"id": 5, "area": "회계환경·기준", "concept": "GAAP 원천", "stem": "회계담당자가 GAAP의 원천을 다음과 같이 정리하였다. 이 중 교수자료의 분류 취지와 가장 거리가 먼 것은?", "options": ["회계기준제정기관이 제정한 회계기준서", "회계기준제정기관이 제공한 회계기준해석서", "전통적으로 회계실무에서 사용되어 온 회계처리방법", "그동안 널리 인용되어 온 교과서의 이론적 근거가 있는 회계처리방법", "새 회계기준서만 GAAP가 될 수 있으므로 기타 권위 있는 기관의 보고서는 실무수용의 근거가 될 수 없다는 판단"], "answer": 4, "explain": "교수자료의 GAAP는 기준서·해석서뿐 아니라 실무에서 수용된 전통적 방법, 이론적 뒷받침, 기타 권위 있는 기관 보고서 등을 포함한다.", "source": "제1장 11쪽 「일반적으로 인정된 회계원칙」", "kind": "개념"}, {"id": 6, "area": "측정·공정가치", "concept": "현행가치 측정기준", "stem": "각 측정대상과 관점에 관한 다음 설명 중 옳은 연결은?", "options": ["공정가치 — 자산의 사용·처분으로 기대하는 회사 고유의 현금흐름 현재가치", "사용가치 — 시장참여자가 부채를 이전할 때 지급할 가격", "사용가치 — 자산 사용·처분에 관한 기업특유의 현재가치, 이행가치 — 부채 이행에 관한 기업특유의 현재가치", "이행가치 — 측정일에 동등한 자산을 다시 취득하는 데 드는 현재의 원가", "현행원가 — 자산을 최초 취득할 때 실제 지급한 과거의 대가"], "answer": 2, "explain": "사용가치는 자산, 이행가치는 부채에 대한 기업특유 측정치다. 공정가치는 시장참여자 관점, 현행원가는 측정일 현재의 원가다.", "source": "제4장 14쪽 「현행가치」", "kind": "개념"}, {"id": 7, "area": "측정·공정가치", "concept": "질적특성과 측정불확실성", "stem": "서로 관련된 자산과 부채를 서로 다른 기준으로 측정한 탓에 회계불일치가 크게 발생하였다. 동시에 자산 측정에 직접 관측할 수 없는 자료가 다수 사용되었다. 해당 상황의 질적특성에 관한 설명으로 가장 적절하지 않은 것은?", "options": ["서로 관련된 항목의 측정기준 차이는 표현충실성을 저해할 가능성이 있다.", "관측 불가능한 변수의 사용은 검증가능성을 낮출 수 있다.", "측정불확실성이 높아도 관련 정보의 목적적합성 자체가 사라지는 것은 아니다.", "동일한 항목을 매기 일관되게 측정하면 비교가능성 향상에 도움이 된다.", "측정불확실성이 증가하면 표현충실성과 무관하게 적시성만 낮아지는 것으로 평가해야 한다."], "answer": 4, "explain": "측정불확실성이 매우 높으면 표현충실성이 저해될 수 있다. 관측가능성과 검증가능성, 관련 자산·부채 측정의 일관성도 따로 판단해야 한다.", "source": "제4장 18~21쪽 「측정기준의 선택과 질적특성」", "kind": "개념"}, {"id": 8, "area": "측정·공정가치", "concept": "공정가치와 이익거래", "stem": "두 금융상품 중 A는 보유이익, B는 보유손실이 발생했다. 기업이 A만 처분하여 이익을 조기 인식하고 B는 보유하여 손실 인식을 늦추려 한다. 다음 설명 중 가장 부적절한 것은?", "options": ["이러한 선택적 처분은 교수자료에서 말하는 이익거래와 관련된다.", "공정가치로 측정하는 모든 금융상품은 보유이익이 실현될 때까지 해당 평가손익을 재무제표에 반영하지 않는다는 점에서 이익거래가 방지된다.", "공정가치는 투자·신용판단에 목적적합한 정보를 제공할 수 있다.", "공시가격이 없어 가치평가기법을 사용하는 경우 측정의 신뢰성이 문제 될 수 있다.", "공정가치가 사용되더라도 측정에 추정이 개입할 수 있다는 점은 별도로 검토해야 한다."], "answer": 1, "explain": "공정가치 측정은 보유가치 변동을 측정치에 반영한다. 모든 금융상품을 공정가치로 평가하면 보유이익 상품만 선택적으로 처분해 이익을 조기 인식하는 이익거래 기회가 줄어든다는 것이 교수자료의 취지다.", "source": "제4장 29쪽 「공정가치의 유용성」", "kind": "개념"}, {"id": 9, "area": "재무제표", "concept": "재무상태표의 한계와 유용성", "stem": "기업은 내부에서 육성한 우수한 인적자원을 보유하고 있지만 재무상태표에는 인적자원의 가치가 표시되지 않았다. 또 역사적원가로 측정된 자산의 시장가치가 상승하였다. 다음 중 적절하지 않은 설명은?", "options": ["재무상태표만으로 모든 경제적 자원의 가치를 파악하는 데 한계가 있다.", "역사적원가 사용은 공정가치와 장부금액 차이를 발생시킬 수 있다.", "재무상태표는 자본집약도 및 재무구조 판단에 유용할 수 있다.", "재무상태표의 대표적 유용성은 해당 기간의 임금협상을 위한 당기 성과 산정이고 유동성 정보는 이에 비해 부차적이다.", "재무상태표는 재무탄력성과 지급능력 판단에 유용할 수 있다."], "answer": 3, "explain": "재무상태표의 대표적인 유용성은 경제적 자원, 재무구조, 유동성, 재무탄력성이다. 임금협상 기초자료는 교수자료에서 손익계산서의 유용성으로 소개된다.", "source": "제3장 8쪽·14쪽 「재무제표의 유용성과 한계」", "kind": "개념"}, {"id": 10, "area": "재무제표", "concept": "식별정보 5개", "stem": "다음은 재무제표 표지와 주석 첫 페이지에 기재된 정보이다.\nㄱ. 보고기업 명칭\nㄴ. 개별재무제표인지 연결재무제표인지 여부\nㄷ. 보고기간 종료일\nㄹ. 감사인의 감사의견\nㅁ. 표시통화\nㅂ. 금액의 표시단위\nㅅ. 대표이사의 성명\n\n교수자료에서 재무제표가 명확히 식별되도록 표시해야 하는 정보만 묶인 것은?", "options": ["ㄱ·ㄴ·ㄷ·ㅁ·ㅂ", "ㄱ·ㄴ·ㄹ·ㅁ·ㅂ", "ㄱ·ㄷ·ㄹ·ㅁ·ㅅ", "ㄴ·ㄷ·ㄹ·ㅂ·ㅅ", "ㄱ·ㄴ·ㄷ·ㄹ·ㅁ·ㅂ"], "answer": 0, "explain": "식별정보 5개: 보고기업 명칭, 개별/연결 여부, 보고기간, 표시통화, 금액단위. 감사의견과 대표이사 이름은 이 목록에 포함되지 않는다.", "source": "제3장 6쪽 「재무제표의 식별」", "kind": "개념"}, {"id": 11, "area": "재고자산", "concept": "실지법과 계속법의 이익비교", "stem": "상품은 모두 개당 취득원가 400원으로 동일하다. 기초 150개, 당기매입 260개, 매입환출 30개, 판매 220개(개당 판매가격 650원), 기말 실사수량 155개이다. 매입·매출에 따른 기타 비용은 없다.\n\n다음 중 계속기록법상 판매시 인식한 매출원가·기말 감모손실·실지재고조사법상 매출원가의 조합으로 옳은 것은?", "options": ["90,000원 / 2,000원 / 88,000원", "88,000원 / 0원 / 90,000원", "88,000원 / 2,000원 / 90,000원", "90,000원 / 2,000원 / 90,000원", "88,000원 / 2,000원 / 88,000원"], "answer": 2, "explain": "판매가능수량=150+260−30=380개, 장부기말=380−220=160개, 실사155개 → 감모5개×400=2,000원. 계속법 판매원가=220×400=88,000원, 실지법 총 COGS=(380−155)×400=90,000원.", "source": "제6장 예제 6-3 「계속기록법과 실지재고조사법」", "kind": "계산"}, {"id": 12, "area": "재고자산", "concept": "이동평균법과 총평균법", "stem": "20X1년 재고 거래는 다음과 같으며 감모는 없다.\n1월 1일 기초: 100개 @40원\n3월 1일 매입: 100개 @60원\n5월 1일 판매: 150개\n8월 1일 매입: 100개 @80원\n11월 1일 판매: 50개\n\n계속기록법의 이동평균법과 실지재고조사법의 총평균법으로 산정한 당기 매출원가의 조합으로 옳은 것은? (원단위 계산, 각 평균단가는 해당 시점의 수량·원가 기준)", "options": ["10,000원 / 12,000원", "11,000원 / 11,000원", "12,000원 / 11,000원", "11,000원 / 12,000원", "12,000원 / 12,000원"], "answer": 3, "explain": "이동평균: 3월 평균50원 → 5월 판매150개 원가7,500원. 8월 남은50개 원가2,500+신규100개 원가8,000=10,500/150개=70원 → 11월 50개 원가3,500원. 총11,000원. 실지 총평균: 판매가능 원가18,000원/300개=60원, 판매200개 COGS12,000원.", "source": "제6장 예제 6-9·6-10 「평균원가법·선입선출법」", "kind": "계산"}, {"id": 13, "area": "재고자산", "concept": "재고자산 포함과 운임", "stem": "㈜A의 기말 창고 실사재고는 700,000원이다. 실사재고에는 수탁판매상품 40,000원과 고객이 이미 검수하여 소유권이 이전된 특별주문품 50,000원이 포함된다. 다음 항목은 실사에 포함되지 않았다.\n• A가 다른 판매점에 위탁한 상품: 원가 100,000원, 발송운임 6,000원\n• FOB 선적지조건 매입 후 미도착 상품: 원가 80,000원, A 부담 매입운임 4,000원\n• FOB 도착지조건 매입 후 미도착 상품: 원가 65,000원\n• FOB 도착지조건으로 판매했으나 고객 미도착 상품: 원가 50,000원(운임 7,000원은 A가 별도로 부담)\n• 시용판매하여 고객 승인이 없는 상품: 원가 35,000원\n\n기말 재무상태표에 표시할 A의 재고자산은?", "options": ["892,000원", "835,000원", "842,000원", "935,000원", "885,000원"], "answer": 4, "explain": "700,000−40,000−50,000+106,000+84,000+50,000+35,000=885,000원. FOB 도착지 매입품65,000원은 아직 판매자 재고, 고객에게 보내는 매출운임7,000원은 재고원가에 가산하지 않는다.", "source": "제6장 예제 6-1 및 6쪽 「미착품·적송품」", "kind": "계산"}, {"id": 14, "area": "재고자산", "concept": "소매재고법 원가율", "stem": "평균법 소매재고법에 관한 자료는 다음과 같다(단위: 원).\n기초재고: 원가 24,000 / 소매가 50,000\n당기매입: 원가 144,000 / 소매가 250,000\n매입환출: 원가 12,000 / 소매가 20,000\n매입운임 6,000, 매출운임 4,000\n판매가격 인상 36,000, 인상취소 6,000\n판매가격 인하 14,000, 인하취소 4,000\n총매출 212,000, 매출환입 12,000\n\n평균법에 따른 당기 매출원가는?", "options": ["108,000원", "102,000원", "112,000원", "114,000원", "106,000원"], "answer": 0, "explain": "판매가능원가=24,000+144,000−12,000+6,000=162,000원. 판매가능소매가=50,000+250,000−20,000+36,000−6,000−14,000+4,000=300,000원, 원가율54%. 순매출=212,000−12,000=200,000원, 기말소매가100,000원, 기말원가54,000원. 매출원가=162,000−54,000=108,000원. 매출운임은 원가율 계산에서도 제외한다.", "source": "제6장 예제 6-17~6-19 「판매가격 변동과 소매재고법」", "kind": "계산"}, {"id": 15, "area": "재고자산", "concept": "후입선출법 청산", "stem": "물가상승기를 가정한다. 기초재고는 과거 취득한 200개 @20원, 당기매입은 150개 @30원이다. 당기 250개를 판매하였고 기말 실사수량은 장부와 같다.\n\n후입선출법(LIFO) 적용 시 매출원가와, 판매 250개 전량이 30원짜리였다고 가정할 때에 비해 LIFO 청산으로 증가하는 이익의 조합은? (법인세·기타 비용 무시)", "options": ["5,500원 / 1,000원", "6,500원 / 1,000원", "6,500원 / 2,000원", "5,500원 / 2,000원", "7,500원 / 1,000원"], "answer": 1, "explain": "LIFO COGS=당기150개×30+과거100개×20=6,500원. 250개 모두 현행원가30원이라면 7,500원이므로 저원가층 청산으로 매출원가가 1,000원 낮아져 이익이 1,000원 높아진다. IFRS는 LIFO 적용을 허용하지 않는다.", "source": "제6장 40~41쪽 「후입선출법의 한계」", "kind": "계산"}, {"id": 16, "area": "재고자산", "concept": "저가법 적용단위", "stem": "다음 네 재고항목의 원가와 순실현가능가치(NRV)는 원 단위이다. A조와 B조는 서로 구분되고, 각 조 내 품목은 유사·관련되어 있다고 가정한다.\n\nA조 a1: 원가 40, NRV 55\nA조 a2: 원가 60, NRV 44\nB조 b1: 원가 55, NRV 42\nB조 b2: 원가 35, NRV 50\n\n저가법을 종목별·조별·총액별로 각각 계산한 금액의 조합은? (총액기준은 비교만을 위한 가상계산이며 IFRS상 적용 가능한 방법을 묻는 것은 아님)", "options": ["161 / 190 / 189", "189 / 161 / 190", "161 / 190 / 190", "161 / 189 / 190", "189 / 189 / 190"], "answer": 3, "explain": "종목별=min(40,55)+min(60,44)+min(55,42)+min(35,50)=40+44+42+35=161. 조별=min(100,99)+min(90,92)=99+90=189. 총액별=min(190,191)=190. 교수자료: 종목별 원칙, 조별 유사·관련 재고 허용, 총액기준 불허.", "source": "제6장 예제 6-13 「재고자산평가—저가법」", "kind": "계산"}, {"id": 17, "area": "지분법", "concept": "지분법손익과 현금배당", "stem": "㈜갑은 20X1년 초 관계기업 ㈜을의 의결권 30%를 1,200,000원에 취득하고 지분법을 적용한다. 20X1년 을의 당기순이익은 420,000원, 현금배당은 120,000원이다. 20X2년 을의 당기순손실은 200,000원, 현금배당은 80,000원이다. 그 밖의 조정사항은 없다.\n\n20X2년에 인식할 지분법손실과 20X2년 말 투자주식 장부금액의 조합은?", "options": ["60,000원 / 1,230,000원", "84,000원 / 1,206,000원", "60,000원 / 1,206,000원", "84,000원 / 1,230,000원", "60,000원 / 1,290,000원"], "answer": 2, "explain": "20X1년 말 장부금액=1,200,000+126,000−36,000=1,290,000원. 20X2년 지분법손실=200,000×30%=60,000원, 배당회수=80,000×30%=24,000원. 기말=1,290,000−60,000−24,000=1,206,000원. 배당은 지분법손익이 아니다.", "source": "제5장 48~49쪽 「지분법이익」", "kind": "계산"}, {"id": 18, "area": "수익인식", "concept": "중요한 금융요소", "stem": "20X1년 1월 1일 상품(원가 3,050,000원)을 할부판매하였다. 계약 당일 현금 590,000원을 받고, 20X1·20X2·20X3년 각 12월 31일에 1,331,000원씩 받는다. 연 유효이자율은 10%이다. 수행의무는 상품인도일에 충족되며 다른 거래는 없다.\n\n20X1년에 이 거래에서 인식할 매출총이익과 이자수익, 20X1년 말 할부매출채권 순장부금액의 조합은?", "options": ["850,000원 / 399,300원 / 2,378,300원", "1,181,000원 / 0원 / 2,310,000원", "850,000원 / 331,000원 / 3,310,000원", "259,000원 / 331,000원 / 2,310,000원", "850,000원 / 331,000원 / 2,310,000원"], "answer": 4, "explain": "미래대금 PV=1,210,000+1,100,000+1,000,000=3,310,000원. 판매수익=590,000+3,310,000=3,900,000원, GP=850,000원. 20X1 이자=3,310,000×10%=331,000원. 기말 채권 순액=3,310,000+331,000−1,331,000=2,310,000원.", "source": "제5장 예제 5-10 「금융요소가 중요한 복합거래」", "kind": "계산"}, {"id": 19, "area": "수익인식", "concept": "고객과의 계약 식별", "stem": "거래 A~E 중 수익인식 5단계의 첫 번째 단계에서 고객과의 계약으로 식별할 수 있는 거래는?", "options": ["구두계약을 승인하고 이행을 확약했으며, 재화·용역의 권리, 지급조건, 상업적 실질이 식별되고 대가 회수가능성이 높다.", "서면계약을 승인하고 지급조건도 식별했지만 거래에 상업적 실질이 없다.", "서면계약을 승인했으나 기업이 고객에게 넘길 자산에 대한 권리관계가 불명확하다.", "거래에 상업적 실질은 있지만 대가를 회수할 가능성이 높다고 판단되지 않는다.", "권리와 지급조건은 확인되었지만 당사자들이 계약상 의무를 수행하기로 확약하지 않았다."], "answer": 0, "explain": "고객과의 계약 식별은 ① 승인·확약 ② 권리 식별 ③ 지급조건 식별 ④ 상업적 실질 ⑤ 회수가능성 높음을 모두 충족해야 한다. 구두로 승인된 계약도 가능하다.", "source": "제5장 8쪽 「고객과의 계약 식별」", "kind": "개념"}, {"id": 20, "area": "건설계약", "concept": "공사변경과 당기계약이익", "stem": "㈜희망은 20X1년 초 건설계약금액 500,000,000원으로 공사를 시작하였다. 건설계약은 기간에 걸쳐 수익을 인식하며 원가법으로 진행률을 측정한다.\n20X1년: 당기 발생 계약원가 80,000,000원, 추정 총계약원가 400,000,000원.\n20X2년: 당기 발생 계약원가 150,000,000원, 추정 총계약원가 460,000,000원. 20X2년에는 계약수익에 포함되는 승인된 공사변경대가 40,000,000원이 추가되었다.\n20X2년 말까지 청구한 공사대금 220,000,000원, 현금 회수 180,000,000원이다.\n\n20X2년 당기 계약이익은?", "options": ["30,000,000원", "20,000,000원", "50,000,000원", "10,000,000원", "70,000,000원"], "answer": 1, "explain": "20X1 누적진행률=80/400=20%, 누적수익=500×20%=100백만원. 20X2 누적원가230/최신 총원가460=50%, 수정 총계약수익540×50%=270백만원. X2 당기수익=270−100=170백만원, 당기원가150백만원 → 당기 계약이익20백만원. 공사대금 청구·회수는 이익 계산의 직접 변수가 아니다.", "source": "제5장 예제 5A-3 「진행기준의 회계처리」", "kind": "계산"}, {"id": 21, "area": "수익인식", "concept": "별도 수행의무 판단", "stem": "소프트웨어 판매회사가 표준 소프트웨어와 고객의 전산시스템을 하나로 결합하는 대규모 맞춤형 통합서비스를 제공한다. 소프트웨어는 통상 단독 판매되지만 이 계약에서는 통합서비스가 소프트웨어를 크게 변형하며 서로 높은 상호의존성을 가진다. 별도 선택이 가능한 일반 교육서비스도 함께 판매한다. 수행의무 식별에 관한 설명으로 가장 적절한 것은?", "options": ["표준 소프트웨어는 별도로 팔 수 있다는 이유만으로 통합서비스와 별도 수행의무가 된다.", "고객이 소프트웨어를 사용할 수 있게 된 후에는 통합서비스의 맞춤화 정도와 관계없이 각기 별도 수행의무가 된다.", "교육서비스가 선택상품인 경우라도 동일 계약에서 제공되므로 무조건 통합산출물 일부다.", "소프트웨어와 맞춤형 통합서비스는 하나의 결합산출물로 판단할 수 있고, 교육서비스는 별도 수행의무가 될 수 있다.", "수행의무를 나눌 때에는 재화 자체의 효익만 확인하면 충분하고 계약 내 다른 약속과의 관계는 고려하지 않는다."], "answer": 3, "explain": "별도 수행의무는 자체 구분 가능성뿐 아니라 계약 내 다른 약속과의 별도 식별 가능성까지 요구한다. 유의적 통합·맞춤화·상호의존은 단일 수행의무 신호다. 일반 교육은 별도 효익·계약 내 구분 여부를 판단한다.", "source": "제5장 예제 5-2 및 10~12쪽 「수행의무의 식별」", "kind": "개념"}, {"id": 22, "area": "수익인식", "concept": "기간수익 인식요건", "stem": "다음 사례 A~E 중 고객과의 계약에서 수행의무가 일정기간에 걸쳐 충족되는 사례는 몇 개인가?\n\nA. 청소용역을 제공하는 대로 고객이 효익을 얻어 소비한다.\nB. 고객 소유 토지 위에 건설 중인 건물을 고객이 통제한다.\nC. 대체용도가 없는 맞춤형 기계를 제작하나, 고객이 공정 중 자산을 통제하지 않고 지금까지 수행분에 대한 집행가능한 지급청구권도 없다.\nD. 대체용도가 없는 특수설비를 제작하며 지금까지 수행분에 대한 집행가능한 지급청구권이 있다.\nE. 표준화된 상품을 기업 창고에 생산하며 생산 중 고객이 자산을 통제하지 않는다.", "options": ["1개", "2개", "4개", "5개", "3개"], "answer": 4, "explain": "A는 동시 소비, B는 제작 중 고객 통제, D는 대체용도 없음과 집행가능 지급청구권을 모두 충족한다. C는 두 조건 중 지급청구권이 없고 다른 기간인식 조건도 없어 제외, E도 제외. 따라서 3개다.", "source": "제5장 26~27쪽 「수익인식 시점」", "kind": "개념"}, {"id": 23, "area": "지분법", "concept": "지분법 투자주식 장부가액", "stem": "㈜갑은 20X1년 1월 1일 ㈜을의 의결권 25%를 800,000원에 취득하여 지분법을 적용했다. 20X1년 ㈜을의 당기순이익은 320,000원이고 현금배당은 80,000원이다. 20X2년 ㈜을의 당기순이익은 160,000원이고 현금배당은 120,000원이다. 다른 조정사항은 없다.\n\n20X2년의 지분법이익과 20X2년 말 장부금액의 조합은?", "options": ["40,000원 / 860,000원", "70,000원 / 870,000원", "40,000원 / 870,000원", "40,000원 / 900,000원", "30,000원 / 870,000원"], "answer": 2, "explain": "20X1 말=800,000+80,000−20,000=860,000원. 20X2 지분법이익=160,000×25%=40,000원, 배당 감소=120,000×25%=30,000원, 기말=860,000+40,000−30,000=870,000원.", "source": "제5장 48~49쪽 「지분법이익」", "kind": "계산"}, {"id": 24, "area": "수익인식", "concept": "패키지 할인배분", "stem": "별도 수행의무 A·B·C의 개별판매가격은 각각 240,000원, 160,000원, 100,000원이다. 세 품목을 묶어 440,000원에 판매한다. C는 단독판매 시에도 100,000원이며, A·B만 묶어 팔면 통상 340,000원이다. 계약의 전체 할인은 A와 B에만 관련된다는 증거가 충분하다.\n\n상대적 개별판매가격 배분 원칙과 할인배분 예외를 적용할 때 B에 배분할 거래가격은?", "options": ["140,800원", "136,000원", "160,000원", "128,000원", "144,000원"], "answer": 1, "explain": "C에는 100,000원을 배분한다. 나머지 340,000원을 A:B=240:160=3:2로 나누면 B에 340,000×160/(240+160)=136,000원. 계약 전체 가격을 세 품목에 단순 비례배분하는 것은 이 사례에서 부적절하다.", "source": "제5장 예제 5-4·5-5 「거래가격 배분」", "kind": "계산"}, {"id": 25, "area": "건설계약", "concept": "전체 예상손실과 당기손익", "stem": "건설기업은 20X1년 초 공사금액 500,000,000원의 계약을 체결하였다. 수행의무는 기간에 걸쳐 충족되며 결과를 신뢰성 있게 추정할 수 있다.\n20X1년: 실제 계약원가 120,000,000원, 추정 총계약원가 400,000,000원.\n20X2년: 실제 추가 계약원가 250,000,000원, 20X2년 말 수정 추정 총계약원가 550,000,000원. 계약수익은 변동 없다. 이 시점에 전체 계약손실이 발생할 것이 확실해져 손실을 전액 반영하였다.\n20X2년에는 별도의 이자수익 3,000,000원과 판매관리비 8,000,000원이 발생하였고 법인세는 무시한다.\n\n20X2년 당기순이익(손실)은?", "options": ["-85,000,000원", "-80,000,000원", "-55,000,000원", "-50,000,000원", "-33,636,364원"], "answer": 0, "explain": "20X1 누적 계약수익=500×(120/400)=150백만원, 기인식 계약이익30백만원. 20X2 총예상원가550>수익500이므로 전체 예상손실50백만원을 인식해야 한다. X2 계약손익=−(과거 이익30+전체 손실50)=−80백만원. X2 당기순손익=−80+이자수익3−판관비8=−85백만원.", "source": "제5장 예제 5A-6 및 79~81쪽 「건설계약의 손실인식」", "kind": "계산"}];

let orders=bag.orders||Object.fromEntries(QS.map(q=>[q.id,randOrder()]));bag.orders=orders;
function save(){if(!bag.submitted)localStorage.setItem(STORE,JSON.stringify(bag))}
$('questions').innerHTML=QS.map(q=>{let order=orders[q.id];return `<article class="card question" id="q${q.id}"><div class="qtitle"><span class="qnum">${q.id}. ${esc(q.concept)}</span><span class="kind">${esc(q.area)} · ${q.kind}</span></div><div class="stem">${esc(q.stem)}</div>${order.map((i,pos)=>`<label class="option"><input type="radio" name="a${q.id}" value="${i}" ${bag.answers[q.id]===i?'checked':''}><span class="no">${NUM[pos]}</span><span>${esc(q.options[i])}</span></label>`).join('')}<div class="extras"><details><summary>헷갈린 선지 표시 / 이유 메모 (선택사항)</summary><p>복수 선택 가능. 정답으로 고른 선지와 관계없이 헷갈린 것을 모두 표시해.</p><div class="doubts">${order.map((i,pos)=>`<label><input type="checkbox" data-doubt="${q.id}" value="${i}" ${(bag.confuse[q.id]||[]).includes(i)?'checked':''}> ${NUM[pos]}번 선지</label>`).join('')}</div><textarea data-note="${q.id}" placeholder="예: 운임이 원가열에 들어가는지 확신이 없었음">${esc(bag.notes[q.id]||'')}</textarea></details></div></article>`}).join('');
$('jump').innerHTML=QS.map(q=>`<a href="#q${q.id}" id="j${q.id}">${q.id}</a>`).join('');
function refresh(){let done=Object.keys(bag.answers).length; $('answered').textContent=`${done}/25 응답`; $('fill').style.width=`${done*4}%`;QS.forEach(q=>$('j'+q.id).classList.toggle('done',bag.answers[q.id]!==undefined))}refresh();
$('questions').addEventListener('change',e=>{if(!bag.started)bag.started=Date.now();if(e.target.matches('input[type=radio]'))bag.answers[Number(e.target.name.substring(1))]=Number(e.target.value);if(e.target.matches('[data-doubt]')){let id=Number(e.target.dataset.doubt);bag.confuse[id]=[...document.querySelectorAll(`[data-doubt="${id}"]:checked`)].map(x=>Number(x.value))}save();refresh()});
$('questions').addEventListener('input',e=>{if(e.target.matches('[data-note]')){bag.notes[Number(e.target.dataset.note)]=e.target.value;save()}});
const timeInterval=setInterval(()=>{if(!bag.started)return;let seconds=Math.max(0,3600-Math.floor((Date.now()-bag.started)/1000));$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000);
function grade(){let empty=QS.filter(q=>bag.answers[q.id]===undefined);if(empty.length&&!confirm(`${empty.length}문항을 아직 풀지 않았습니다. 그대로 채점할까요?`))return;bag.submitted=true;save();localStorage.removeItem(STORE);clearInterval(timeInterval);const solved=QS.map(q=>({...q,correct:bag.answers[q.id]===q.answer,flagged:(bag.confuse[q.id]||[]).length>0||!!(bag.notes[q.id]||'').trim()}));const n=solved.filter(q=>q.correct).length;$('points').textContent=n*4;$('overall').textContent=`정답 ${n}개 · 오답/미응답 ${25-n}개 · 헷갈림·메모 ${solved.filter(q=>q.flagged).length}개 (60분 타이머는 참고용)`;let groups=[...new Set(QS.map(q=>q.area)),'계산','개념'];$('metrics').innerHTML=groups.map(g=>{let a=solved.filter(q=>q.area===g||q.kind===g),c=a.filter(q=>q.correct).length,p=Math.round(c/a.length*100);return `<div class="metric"><div class="mtop"><span>${esc(g)}</span><span>${p}% · ${c}/${a.length}</span></div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join('');window.results=solved;render();$('submitSection').classList.add('hidden');$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'})}
function resultContent(q){let mine=bag.answers[q.id],o=orders[q.id],desc=(ix)=>ix===undefined?'미응답':NUM[o.indexOf(ix)]+' '+q.options[ix];let doubts=bag.confuse[q.id]||[];return `<div class="rline ${q.correct?'right':'wrong'}"><div class="rtitle">${q.id}번 · ${esc(q.concept)} · ${q.correct?'정답':'오답'}${q.flagged?' · 헷갈림 기록':''}</div><div class="details"><b>내 답:</b> ${esc(desc(mine))}<br><b>정답:</b> ${esc(desc(q.answer))}<br>${doubts.length?`<b>헷갈린 선지:</b> ${doubts.map(i=>NUM[o.indexOf(i)]).join(', ')}<br>`:''}${bag.notes[q.id]?`<b>메모:</b> ${esc(bag.notes[q.id])}<br>`:''}<b>정답 근거:</b> ${esc(q.explain)}</div><div class="source">교수자료 참조: ${esc(q.source)}</div></div>`}
function render(){const a=window.results;let weak=a.filter(x=>!x.correct||x.flagged);$('weak').innerHTML=weak.length?weak.map(q=>`<div class="vital"><strong>${q.id}번 · ${esc(q.concept)}</strong><span style="font-size:12px">${q.correct?'정답이지만 헷갈림':'오답'}</span><div style="font-size:14px">${esc(q.explain)}</div></div>`).join(''):'<p>오답과 헷갈림 표시가 없어요. 다른 숫자·조건으로 반복 점검해보면 좋아요.</p>';$('reviews').innerHTML=a.filter(q=>!focus||!q.correct||q.flagged).map(resultContent).join('')}
$('submitBtn').addEventListener('click',grade);$('toggleFocus').onclick=()=>{focus=!focus;$('toggleFocus').textContent=focus?'전체 해설 보기':'오답·헷갈린 선지만 보기';render()};$('reset').onclick=()=>{if(confirm('기존 답안을 지우고 다시 풀까요?')){localStorage.removeItem(STORE);location.reload()}};
$('copyReport').onclick=async()=>{const lines=[`중급회계 3회 예제심화 모의고사: ${window.results.filter(q=>q.correct).length*4}/100`,...window.results.filter(q=>!q.correct||q.flagged).map(q=>`${q.id}번 ${q.concept} / ${q.correct?'정답·헷갈림':'오답'} / 선택 ${bag.answers[q.id]===undefined?'미응답':NUM[orders[q.id].indexOf(bag.answers[q.id])]} / 헷갈린 선지 ${(bag.confuse[q.id]||[]).map(i=>NUM[orders[q.id].indexOf(i)]).join(',')||'-'} / 이유: ${bag.notes[q.id]||'-'}`)];const txt=lines.join('\n');try{await navigator.clipboard.writeText(txt);$('copyStatus').textContent='복사 완료 — 채팅에 붙여 넣어줘'}catch(e){let el=document.createElement('textarea');el.value=txt;document.body.append(el);el.select();document.execCommand('copy');el.remove();$('copyStatus').textContent='복사 시도 완료'}};
</script></body></html>
